<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Myositis Home Companion</title>
<!-- "Add to Home Screen" support (iOS Safari: Share -> Add to Home Screen; Android Chrome: menu ->
     Install app): launches full-screen with no browser chrome, its own icon and title, so it reads
     like a real app today without leaving this single static file / GitHub Pages deployment. A
     true native iPhone app is a separate, much larger project -- different tech stack, Xcode, an
     Apple Developer account -- and isn't what this does; see the chat response for that distinction. -->

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Myositis">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563a6">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563a6'/%3E%3Ctext x='50' y='64' font-size='54' text-anchor='middle' fill='white' font-family='Arial, sans-serif'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f2f5f8; --surface:#ffffff; --text:#1c2530; --muted:#5b6b7b; --border:#dbe3ea;
    --primary:#2563a6; --primary-dark:#194673; --primary-bg:#e8f0fa;
    --success:#1f8a55; --success-bg:#e7f6ee;
    --warning:#9a6b00; --warning-bg:#fff6df;
    --danger:#b3241c; --danger-bg:#fdeceb;
    --radius:10px; --shadow:0 1px 3px rgba(20,30,40,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;}
  #banner{position:sticky;top:0;z-index:200;background:#7a1f1f;color:#fff;padding:9px 16px;font-size:13px;text-align:center;font-weight:600;box-shadow:var(--shadow);}
  #banner strong{text-transform:uppercase;letter-spacing:.4px;}
  header.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:34px;z-index:150;box-shadow:var(--shadow);}
  header.topnav h1{font-size:16px;margin:0;color:var(--primary-dark);white-space:nowrap;}
  .role-toggle{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px;}
  .role-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);}
  .role-toggle button.active{background:var(--primary);color:#fff;}
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);
  }
  textarea{width:100%;resize:vertical;}
  button.btn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;}
  button.btn:hover{background:var(--primary-dark);}
  button.btn.secondary{background:#fff;color:var(--primary);}
  button.btn.danger{background:var(--danger);border-color:var(--danger);}
  button.btn.ghost{background:transparent;border-color:var(--border);color:var(--text);}
  button.btn.success{background:var(--success);border-color:var(--success);}
  button.btn.success:hover{background:#16703f;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}
  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px;}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tabs button{border:1px solid var(--border);background:#fff;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
  .tabs button.active{background:var(--primary-bg);color:var(--primary-dark);border-color:var(--primary);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 10px;font-size:15px;}
  .card h3{margin:14px 0 8px;font-size:13.5px;color:var(--primary-dark);}
  .muted{color:var(--muted);font-size:12.5px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;font-weight:600;color:var(--muted);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table th, table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}
  table th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}
  .alert{border-radius:8px;padding:11px 13px;margin-bottom:10px;font-size:13px;border:1px solid transparent;}
  .alert h4{margin:0 0 4px;font-size:13px;}
  .alert-danger{background:var(--danger-bg);border-color:#f0b3ad;color:var(--danger);}
  .alert-warning{background:var(--warning-bg);border-color:#f0d68a;color:var(--warning);}
  .alert-info{background:var(--primary-bg);border-color:#bcd6f0;color:var(--primary-dark);}
  .alert-success{background:var(--success-bg);border-color:#a9e0c1;color:var(--success);}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
  .pill-core{background:#e8f0fa;color:#2563a6;} .pill-targeted{background:#f4e8fa;color:#7a2ea6;}
  .pill-endurance{background:#fff1e0;color:#b06a00;} .pill-aerobic{background:#e7f6ee;color:#1f8a55;}
  .stop-banner{background:var(--danger);color:#fff;padding:16px;border-radius:var(--radius);font-size:15px;font-weight:700;text-align:center;margin-bottom:14px;box-shadow:0 2px 10px rgba(179,36,28,.4);}
  .stop-banner .sub{font-weight:500;font-size:12.5px;margin-top:4px;}
  .success-banner{background:var(--success);color:#fff;padding:16px;border-radius:var(--radius);font-size:15px;font-weight:700;text-align:center;margin-bottom:14px;box-shadow:0 2px 10px rgba(31,138,85,.35);}
  .progress-bar{background:var(--bg);border:1px solid var(--border);border-radius:20px;height:10px;overflow:hidden;margin:4px 0;}
  .progress-bar-fill{background:var(--primary);height:100%;border-radius:20px 0 0 20px;transition:width .2s;}
  .progress-bar-fill.complete{background:var(--success);border-radius:20px;}
  .criteria-list{list-style:none;padding:0;margin:0;font-size:12.5px;}
  .criteria-list li{padding:5px 0;border-bottom:1px dashed var(--border);display:flex;align-items:center;gap:6px;}
  .criteria-list li.met{color:var(--success);}
  .criteria-list li.pending{color:var(--muted);}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,25,35,.55);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;}
  .modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.3);}
  .modal h2{margin-top:0;}
  .patient-card{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:#fff;transition:background .1s;}
  .patient-card:hover{background:var(--primary-bg);}
  .patient-card .name{font-weight:700;font-size:14px;}
  .exercise-item{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
  .exercise-item .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .history-list{font-size:11.5px;color:var(--muted);margin-top:6px;padding-left:16px;}
  .chart-wrap{overflow-x:auto;}
  svg.chart text{font-size:9.5px;fill:var(--muted);font-family:inherit;}
  .yesno{display:flex;gap:8px;}
  .yesno button{flex:1;padding:9px;border-radius:6px;border:1px solid var(--border);background:#fff;font-weight:600;cursor:pointer;}
  .yesno button.selected-yes{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .yesno button.selected-no{background:var(--success-bg);border-color:var(--success);color:var(--success);}
  .stepper{display:flex;align-items:center;justify-content:center;gap:10px;}
  .stepper button{width:48px;height:48px;min-width:48px;border-radius:50%;font-size:22px;font-weight:700;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text);}
  .stepper button.plus{background:var(--success);border-color:var(--success);color:#fff;}
  .stepper button.minus{background:#fff;}
  .stepper input{width:64px;text-align:center;font-size:24px;font-weight:800;padding:8px 4px;}
  .rpe-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px;}
  .rpe-grid button{padding:7px 0;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);}
  .rpe-grid button.rpe-low{background:var(--success-bg);border-color:var(--success);}
  .rpe-grid button.rpe-mid{background:var(--warning-bg);border-color:var(--warning);}
  .rpe-grid button.rpe-high{background:var(--danger-bg);border-color:var(--danger);}
  .rpe-grid button.selected{outline:2px solid var(--primary);outline-offset:1px;}
  .rpe-chip-row{display:flex;justify-content:center;gap:6px;margin:4px 0 8px;flex-wrap:wrap;}
  .rpe-chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
  .rpe-chip.rpe-low{background:var(--success-bg);border-color:var(--success);color:var(--success);}
  .rpe-chip.rpe-mid{background:var(--warning-bg);border-color:var(--warning);color:var(--warning);}
  .rpe-chip.rpe-high{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .lib-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .lib-item .region{font-size:11px;color:var(--primary);font-weight:700;text-transform:uppercase;}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .switch{position:relative;display:inline-block;width:42px;height:23px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#c6cfd8;border-radius:24px;transition:.15s;}
  .slider:before{position:absolute;content:"";height:17px;width:17px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--primary);}
  input:checked + .slider:before{transform:translateX(19px);}
  .flag-list{list-style:none;padding:0;margin:0;font-size:12.5px;}
  .flag-list li{padding:4px 0;border-bottom:1px dashed var(--border);}
  .review-item{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:#fafcfe;}
  .review-item input, .review-item select{width:100%;margin-top:3px;}
  .legend{display:flex;gap:14px;font-size:11.5px;margin-top:4px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .ibmfrs-item{border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;}
  .ibmfrs-item .item-label{font-size:11px;color:var(--muted);margin-bottom:4px;min-height:26px;}
  .ibmfrs-item .item-delta{font-size:12px;font-weight:700;margin-top:2px;}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px;}
</style>
</head>
<body>
<div id="banner">
  <strong>Research Prototype</strong> — Seeded demo data only. Not connected to any real EHR or PHI. Not for clinical use.
</div>
<div id="app"></div>
<footer>Myositis Home Companion · Client-side demo · Data lives only in this browser's local storage</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
"use strict";

/* ======================== Constants ======================== */
var STORAGE_KEY = "myositisCompanionData_v1";
// Set this to a deployed instance of /server (e.g. "https://your-backend.example.com")
// to enable real magic-link PT sharing: secure tokens, email delivery, revocation, and
// an audit trail, all server-side. GitHub Pages cannot run that server itself, so this
// stays a separate deployment; leave this blank to keep Sharing Settings in a local-only
// demo mode (toggle only, no email, no revocable link — the old placeholder behavior).
var SHARING_API_BASE = "";
function sharingApiUrl(path){ return SHARING_API_BASE.replace(/\/$/,"") + path; }
var CATEGORIES = ["Core","Targeted","Endurance","Aerobic"];
var RECOVERY_LABELS = {
  under30:"Recovered < 30 min", between30and60:"Recovered 30–60 min",
  over60:"Recovered > 60 min", notRecovered:"Not recovered"
};
var IBM_DIAGNOSIS = "Inclusion Body Myositis (IBM)";
var DIAGNOSIS_OPTIONS = [
  "Polymyositis (PM)", "Dermatomyositis (DM)", "Necrotizing myopathy (NM)", "Anti-synthetase syndrome", IBM_DIAGNOSIS
]; // diagnosisSubtype routes IBM patients to the IBMFRS below; no other IBM-specific clinical logic is implemented
function isIbmPatient(patient){ return patient.diagnosisSubtype === IBM_DIAGNOSIS; }

var MUSCLES = [
  {key:"hipFlexors", label:"Hip flexors"}, {key:"kneeExtensors", label:"Knee extensors"},
  {key:"shoulderAbductors", label:"Shoulder abductors"}, {key:"ankleDorsiflexors", label:"Ankle dorsiflexors"}
];
// Measures shared by every patient regardless of diagnosis subtype.
var FOM_COMMON_MEASURES = [
  {key:"gaitSpeed", label:"Gait speed (m/s)"}, {key:"tug", label:"TUG (s)"},
  {key:"sts30", label:"30s-STS (reps)"}, {key:"sts5x", label:"5x-STS (s)"},
  {key:"mwt2", label:"2MWT (m)"}, {key:"mwt6", label:"6MWT (m)"}
];
// FI-2/FI-3 are used for the non-IBM subtypes; IBM patients use the IBMFRS instead (see below).
// The two scales are never shown together for the same patient.
var FOM_NON_IBM_MEASURES = [
  {key:"fi2", label:"FI-2 (score)"}, {key:"fi3", label:"FI-3 (score)"}
];
// IBMFRS (Inclusion Body Myositis Functional Rating Scale) is a validated, IBM-specific 10-item scale,
// each item scored 0 (unable to perform) to 4 (normal); total range 0-40, HIGHER = BETTER (opposite of most
// symptom scales in this app). A drop of >=2 points on the total between visits is the published threshold
// for a clinically meaningful decline (see Rules.ibmfrsDeclineFlag below).
//
// IMPORTANT: the labels/descriptions below are generic placeholders grouped by the domains the real scale
// covers (swallowing, upper-limb tasks, self-care, bed mobility, lower-limb function) — they are NOT the
// validated item wording. Before this goes into actual clinical use, replace these placeholders with the
// exact item text from the real instrument, available at understandingmyositis.org. A validated scale's
// scoring properties depend on using its exact wording, not a paraphrase.
var IBMFRS_ITEMS = [
  {key:"item1", label:"Item 1", placeholder:"Swallowing"},
  {key:"item2", label:"Item 2", placeholder:"Handwriting"},
  {key:"item3", label:"Item 3", placeholder:"Cutting food"},
  {key:"item4", label:"Item 4", placeholder:"Handling utensils"},
  {key:"item5", label:"Item 5", placeholder:"Dressing"},
  {key:"item6", label:"Item 6", placeholder:"Hygiene"},
  {key:"item7", label:"Item 7", placeholder:"Bed mobility"},
  {key:"item8", label:"Item 8", placeholder:"Sit-to-stand"},
  {key:"item9", label:"Item 9", placeholder:"Walking"},
  {key:"item10", label:"Item 10", placeholder:"Stair climbing"}
];
function ibmfrsTotal(items){ return items.reduce(function(a,b){ return a + (Number(b)||0); }, 0); }
function fomMeasuresFor(patient){
  return isIbmPatient(patient)
    ? FOM_COMMON_MEASURES.concat([{key:"ibmfrsTotal", label:"IBMFRS Total (0–40, higher = better)"}])
    : FOM_COMMON_MEASURES.concat(FOM_NON_IBM_MEASURES);
}
var PROGRESSION_STEPS = {
  1:{startReps:20, advanceAt:30}, 2:{startReps:15, advanceAt:25}, 3:{startReps:10, advanceAt:20}, 4:{repsRange:[10,20]}
};

// ---- Phase Progression (Rule 3, v3) ----
// Additive to the weighted Step 1-4 table above (Rule 3a) — fixed, non-per-patient templates for
// the Phase 1 -> Phase 2 bodyweight/functional track. See Rules.checkPhaseAdvancement,
// Rules.advancePhaseDosage, and buildPhaseDosageTemplate below.
var PHASE_TEMPLATES = {
  1: {
    label:"Phase 1 (supine/sidelying, bodyweight)",
    exercises:["Transversus abdominis activation","Heel slides","Straight leg raise","Clamshells","Sidelying hip abduction","Bridging"],
    aerobic:{name:"Recumbent bike", detail:"Level 3, 80 steps/min, 10 minutes"}
  },
  2: {
    label:"Phase 2 (standing/functional)",
    exercises:["Sit to stand from chair","Wall squats","Step ups","Standing hip flexion","Standing hip abduction"],
    aerobic:{name:"Recumbent bike", detail:"Level 4, 80 steps/min, 15 minutes"}
  }
};
// TODO: the real IBM-specific exercise name and dosage for this slot still needs to come from
// clinical input (see understandingmyositis.org-sourced-wording caveat elsewhere in this file for
// the IBMFRS items) — this is a placeholder so both phase templates have a slot for it, not a
// real prescription. Do not treat this as clinically validated.
var IBM_PHASE_EXTRA_EXERCISE = "Quad sets / short-arc quads (IBM-specific — exercise & dosage TBD)";
function buildPhaseDosageTemplate(patient, phase){
  var names = PHASE_TEMPLATES[phase].exercises.slice();
  if(isIbmPatient(patient)) names.push(IBM_PHASE_EXTRA_EXERCISE);
  // "2 sets of 10 initially, progressing up to 3 sets of 10"
  return names.map(function(name){ return {name:name, targetSets:3, targetReps:10, currentSets:2}; });
}
// FUTURE DIRECTION (not yet implemented -- intentionally, see note): each DailyLog entry's
// exerciseRpes now captures, per exercise, the actual setsCompleted/repsCompleted the patient
// reported alongside their Borg RPE (collected in Actions.submitExerciseRpe) -- exactly the
// "tracking actual per-exercise sets/reps the patient reports" data this comment used to say was
// still missing. That data is meant to eventually drive automatic reps/sets adjustment for that
// specific exercise within its targetSets/targetReps goal (e.g. the "3 sets of 10" above), on top
// of the existing round-robin Rules.advancePhaseDosage. No RPE-to-reps/sets thresholds have been
// specified yet, and this app deliberately never invents clinical thresholds (see the IBM
// placeholder above, or the PDF import's "never auto-apply" rule) -- so exerciseRpes is captured
// and stored, but nothing reads it to change dosage yet. Needs real thresholds (e.g. "RPE <=X for
// N sessions -> increase", "RPE >=Y -> hold or reduce") from clinical input before this is
// implemented.
var REFERENCE_EXERCISES = [
  {id:"r1", name:"Sit-to-Stand", region:"Hip/Knee", category:"Core", desc:"Rise from a chair to standing without hand assist if tolerated; sit back with control.", equipment:"Sturdy chair"},
  {id:"r2", name:"Mini Squat", region:"Hip/Knee", category:"Core", desc:"Partial-range squat holding a stable surface as needed.", equipment:"Counter or rail"},
  {id:"r3", name:"Standing Hip Abduction", region:"Hip", category:"Targeted", desc:"Lift leg sideways with control, hips level, minimal trunk lean.", equipment:"Chair for balance"},
  {id:"r4", name:"Straight Leg Raise", region:"Hip/Knee", category:"Targeted", desc:"Supine, tighten quad, lift straight leg to hip height.", equipment:"Mat"},
  {id:"r5", name:"Heel Raises", region:"Ankle", category:"Targeted", desc:"Rise onto toes, lower slowly under control.", equipment:"Counter for balance"},
  {id:"r6", name:"Seated Ankle Pumps", region:"Ankle", category:"Endurance", desc:"Alternate dorsiflexion/plantarflexion for circulation and endurance.", equipment:"Chair"},
  {id:"r7", name:"Wall Push-up", region:"Shoulder", category:"Core", desc:"Hands on wall, lower chest toward wall, press back.", equipment:"Wall"},
  {id:"r8", name:"Shoulder Flexion Raise", region:"Shoulder", category:"Targeted", desc:"Raise arm forward to shoulder height, light or no weight.", equipment:"Optional light dumbbell"},
  {id:"r9", name:"Scapular Squeeze", region:"Shoulder", category:"Targeted", desc:"Squeeze shoulder blades together, hold, release.", equipment:"None"},
  {id:"r10", name:"Seated Marching", region:"Hip", category:"Endurance", desc:"Alternate lifting knees while seated, moderate pace.", equipment:"Chair"},
  {id:"r11", name:"Bridging", region:"Hip/Core", category:"Core", desc:"Supine, lift hips off mat, squeeze glutes, lower slowly.", equipment:"Mat"},
  {id:"r12", name:"Modified Plank", region:"Core", category:"Core", desc:"Forearm or hands-and-knees plank, brace trunk.", equipment:"Mat"},
  {id:"r13", name:"Stationary Cycling", region:"Whole Body", category:"Aerobic", desc:"Low resistance, steady cadence, monitor RPE closely.", equipment:"Stationary bike"},
  {id:"r14", name:"Supported Treadmill Walking", region:"Whole Body", category:"Aerobic", desc:"Level walking at a comfortable pace with rail support available.", equipment:"Treadmill"},
  {id:"r15", name:"Water Walking", region:"Whole Body", category:"Aerobic", desc:"Chest-deep water walking; buoyancy reduces joint/muscle load.", equipment:"Pool"},
  {id:"r16", name:"Sit-to-Stand Endurance Set", region:"Hip/Knee", category:"Endurance", desc:"Repeated sit-to-stand cycles at a sustainable pace for time.", equipment:"Sturdy chair"}
];

// ---- Exercise media (illustration + demo video + written instructions) ----
// Maps each exercise's exact name (as it appears in REFERENCE_EXERCISES and PHASE_TEMPLATES --
// note some phase-template names differ only in casing from their reference-library counterpart,
// e.g. "Straight leg raise" vs "Straight Leg Raise", so both are listed separately) to a simple
// illustrative pose key (see EXERCISE_POSE_SVGS/renderExerciseMedia below), a demo video, and a
// one-sentence written description of the movement (desc). Both the video and desc are generic,
// independently-known descriptions of a standard, widely-taught exercise -- the same kind of
// one-liner printed on virtually any generic PT handout -- not anything myositis-specific,
// clinically prescribed, or carrying a sets/reps/intensity decision; same "never invent clinical
// content" rule as the IBM placeholder exercise and the PDF-import review screen. Several desc
// values are reused verbatim from REFERENCE_EXERCISES where the same exercise appears there.
//
// IMPORTANT CAVEAT: these video URLs were found via web search (matched by title/channel/
// description across multiple independent search queries) but NOT fetched and confirmed to
// actually load -- this sandbox's network egress proxy blocks every domain except github.com, so
// neither this app nor the research agent that found these could directly verify a single one
// resolves. Treat these as "best candidate found," not "confirmed working," until someone clicks
// through on a normal connection. videoCaveat flags the ones the research agent itself was least

/* ======================== Utilities ======================== */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return toISO(new Date()); }
function parseISO(s){ var p=s.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDaysISO(s, n){ var d=parseISO(s); d.setDate(d.getDate()+n); return toISO(d); }
function daysBetween(s1, s2){ return Math.round((parseISO(s2)-parseISO(s1))/86400000); }
function fmtDate(s){ if(!s) return ""; var d=parseISO(s); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
// For full ISO datetimes coming back from the sharing backend (createdAt/expiresAt/lastAccessedAt),
// as opposed to the plain YYYY-MM-DD strings used everywhere else in this app.
function fmtDateTime(iso){ if(!iso) return ""; var d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function uid(prefix){ return prefix+"_"+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}
function nowISOTime(){ return new Date().toISOString(); }
function avg(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : null; }

function buildSeedData(){
  var today = todayISO();

  // ---- Patient A: normal / steady case ----
  var aLogs = [];
  for(var i=20;i>=0;i--){
    var date = addDaysISO(today, -i);
    var dow = parseISO(date).getDay(); // 1,3,5 = Mon/Wed/Fri session days
    if(dow===1||dow===3||dow===5){
      aLogs.push({date:date, logged:true, completed:true, rpe: 3+(i%3===0?1:0), pain: 1+(i%4===0?1:0),
        fatigue: 2+(i%5===0?1:0), recovery:"under30", progressive:false, adlImpact:false, note:""});
    }
    // Rest days (dow 2, 4) intentionally have no entry: pain/fatigue are only asked around an
    // actual session now, so there's nothing to log on a day without one.
  }
  // Pick whichever completed session lands closest to ~9 days ago and mark it as a slow-recovery
  // session; this is resolved from the actual generated logs (not a fixed day offset) so it stays
  // correct no matter what day of the week "today" is when the demo data is first seeded.
  var completedALogs = aLogs.filter(function(l){ return l.completed; });
  var over60Target = addDaysISO(today,-9);
  var over60Log = completedALogs.reduce(function(best,l){
    return (!best || Math.abs(daysBetween(l.date,over60Target))<Math.abs(daysBetween(best.date,over60Target))) ? l : best;
  }, null);
  over60Log.recovery = "over60";
  over60Log.note = "More tired than usual after session, resolved by next day.";

  // missing, to demonstrate Rule 4. This is a deliberate exception to "no entry on a

  // exercise session, so it's kept even though the current patient-facing form no longer has
  // a way to create a non-session entry itself.
  var next1 = addDaysISO(over60Log.date,1);
  if(!aLogs.some(function(l){return l.date===next1;})){

/* ======================== Storage ======================== */
// Backfills Phase Progression fields onto patients saved by an earlier version of this app
// (before this feature existed), so existing localStorage data doesn't crash on load.
function ensurePhaseFields(patient){
  if(patient.phase==null) patient.phase = 1;
  if(patient.progressionModel==null) patient.progressionModel = "parallel";
  if(patient.dosageFrequencyDays==null) patient.dosageFrequencyDays = 2;
  if(patient.romConfirmed==null) patient.romConfirmed = false;
  if(!Array.isArray(patient.phaseDosage)) patient.phaseDosage = buildPhaseDosageTemplate(patient, patient.phase);
}
// Backfills each dailyLogs entry's `sessions` array -- added to support more than one completed
// workout on the same calendar day (see Actions.startWorkout/submitSessionWrapup). Seed data (and
// any existing localStorage data saved by an earlier version of this app) still only carries a
// single rpe/exerciseRpes pair directly on the entry; this wraps that into a one-item sessions
// array and removes the old fields so every other part of the app only ever reads sessions.
// pain/fatigue/postExerciseRelated/adlImpact stay on the entry itself -- they represent the most
// recently reported feeling that day, not a specific session.
function ensureSessionsField(patient){
  patient.dailyLogs.forEach(function(l){
    if(Array.isArray(l.sessions)) return;
    l.sessions = (l.completed && l.rpe!=null) ? [{rpe:l.rpe, exerciseRpes:l.exerciseRpes||[]}] : [];
    delete l.rpe; delete l.exerciseRpes;
  });
}
function loadData(){
  var raw = localStorage.getItem(STORAGE_KEY);
  var data = null;
  if(raw){
    try{ data = JSON.parse(raw); }catch(e){ /* fall through to reseed */ }
  }
  if(!data){
    data = buildSeedData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  data.patients.forEach(ensurePhaseFields);
  data.patients.forEach(ensureSessionsField);
  return data;
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(Data)); }
function resetDemoData(){
  if(!confirm("Reset all demo data back to the seeded starting state? This cannot be undone.")) return;
  Data = buildSeedData();
  Data.patients.forEach(ensureSessionsField);
  saveData();
  State.patientId = Data.patients[0].id;
  State.clinicianSelectedPatientId = null; State.clinicianView = "list";
  render();
}

/* ======================== Rule Engine (deterministic, clinician-authored) ======================== */
var Rules = {};

// Rule 1: gate check
Rules.gateCheck = function(patient){
  if(!patient.clearedForExercise){
    return {blocked:true, message:"Hold, not cleared.", reason:"Not cleared for exercise by physician."};
  }
  if(patient.inFlare){
    return {blocked:true, message:"Hold, not cleared.", reason:"Currently in flare."};
  }
  return {blocked:false};
};

// Rule 2: stop / regression
// KNOWN GAP (accepted, not an oversight): `allHigh` needs pain/fatigue (collected again) and
// `recentFlags` needs `progressive`/`adlImpact` both true. `adlImpact` is collected again too
// ("This is affecting my daily activities"), but `progressive` ("feels progressively worse, not
// just normal soreness") has no equivalent in the current form -- the closest field,
// `postExerciseRelated` ("this pain/fatigue is related to my last exercise session"), asks a
// different question (attribution/timing, not a worsening trend) and was deliberately NOT mapped
// onto `progressive`. So `recentFlags` still can't be satisfied by newly-logged data. Still works
// against the existing seeded/historical data, which was deliberately left as-is.
Rules.stopRegressionCheck = function(patient){
  var logged = patient.dailyLogs.filter(function(l){ return l.logged; })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(logged.length<3) return {triggered:false};
  var last3 = logged.slice(-3);
  var consecutiveCalendar = daysBetween(last3[0].date,last3[1].date)===1 && daysBetween(last3[1].date,last3[2].date)===1;
  var allHigh = last3.every(function(d){ return (d.pain!=null && d.pain>=5) || (d.fatigue!=null && d.fatigue>=5); });
  var mostRecent = last3[2];
  var recentFlags = mostRecent.progressive===true && mostRecent.adlImpact===true;
  if(consecutiveCalendar && allHigh && recentFlags){
    return {triggered:true, message:"STOP — contact PT/physician immediately", days:last3};
  }
  return {triggered:false};
};

// Rule 3: missed-log check-in
Rules.missedLogCheck = function(patient){
  var logged = patient.dailyLogs.filter(function(l){ return l.logged; })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(!logged.length) return {shouldPrompt:false};
  var lastLog = logged[logged.length-1];
  var gap = daysBetween(lastLog.date, todayISO());
  if(gap<3) return {shouldPrompt:false};
  var lastCompleted = null;
  for(var i=logged.length-1;i>=0;i--){ if(logged[i].completed){ lastCompleted=logged[i]; break; } }
  return {shouldPrompt:true, daysSinceLastLog:gap, lastLogDate:lastLog.date, lastCompletedLog:lastCompleted};
};
Rules.checkinConcernFlag = function(entry){
  return entry.afterSessionPain>=5 || entry.afterSessionFatigue>=5 ||
         entry.currentPain>=5 || entry.currentFatigue>=5 || entry.concernNoted===true;
};

// Rule 4: recovery-time flag
// KNOWN GAP (accepted, not an oversight): depends on each log's `recovery` field, which the
// daily log form no longer collects. `flagged` below will simply stay empty for any newly-logged
// data. Still works against the existing seeded/historical data, which was deliberately left as-is.
Rules.recoveryTimeFlags = function(patient){
  var byDate = {};
  patient.dailyLogs.forEach(function(l){ if(l.logged) byDate[l.date]=l; });
  var flagged = patient.dailyLogs.filter(function(l){
    return l.completed && (l.recovery==="over60" || l.recovery==="notRecovered");
  });
  return flagged.map(function(l){
    var d24 = addDaysISO(l.date,1), d48 = addDaysISO(l.date,2);
    return {
      sessionDate:l.date, recovery:l.recovery,
      has24h: !!byDate[d24], date24:d24,
      has48h: !!byDate[d48], date48:d48
    };
  });
};

// Rule 5: weighted progression status (read-only info; advancing is a separate explicit clinician action)
Rules.progressionStatus = function(progression){
  if(!progression) return null;
  var step = progression.step;
  if(step<4){
    var def = PROGRESSION_STEPS[step];
    var readyToAdvance = progression.currentReps>=def.advanceAt;
    return {step:step, readyToAdvance:readyToAdvance, target:def.advanceAt, startReps:def.startReps, atCeiling:false};
  }
  var atCeiling = progression.currentWeight>=progression.ceiling && progression.currentSets>=3;
  var readyToAddSet = progression.currentReps>=PROGRESSION_STEPS[4].repsRange[1] && progression.currentSets<3;
  return {step:4, readyToAdvance:readyToAddSet, atCeiling:atCeiling};
};
Rules.advanceProgression = function(progression, newWeight){
  // Explicit clinician-confirmed transition. Never called automatically.
  if(progression.step<4){
    progression.step += 1;
    progression.currentReps = PROGRESSION_STEPS[progression.step===4?4:progression.step].startReps || PROGRESSION_STEPS[progression.step].startReps;
    progression.currentWeight = newWeight!=null ? newWeight : progression.currentWeight;
    progression.currentSets = 1;
  } else {
    progression.currentSets = Math.min(3, progression.currentSets+1);
    progression.currentReps = PROGRESSION_STEPS[4].repsRange[0];
  }
  return progression;
};

// Rule 3 (v3): Phase Progression — additive to the weighted Step 1-4 table above (Rule 3a).
// Never auto-advances `phase`; see Actions.confirmPhaseAdvance for the explicit clinician action.
Rules.checkPhaseAdvancement = function(patient){
  var logged = patient.dailyLogs.filter(function(l){ return l.logged; }).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var mostRecent = logged.length ? logged[logged.length-1] : null;
  var painOk = !!mostRecent && mostRecent.pain!=null && mostRecent.pain<=5;
  // Fatigue on the most recent log is an approximation of "fatigue the day after" — a simplification,
  // same caveat as the recovery-time-flag logic elsewhere in this app (Rule 4).
  var fatigueOk = !!mostRecent && mostRecent.fatigue!=null && mostRecent.fatigue<=5;
  var romOk = patient.romConfirmed === true;
  var dosageOk = patient.phaseDosage.length>0 && patient.phaseDosage.every(function(d){ return d.currentSets>=d.targetSets; });
  var criteria = [
    {key:"pain", label:"Pain ≤5 on most recent log", met:painOk},
    {key:"fatigue", label:"Fatigue ≤5 on most recent log (approximates “fatigue the day after” — a simplification)", met:fatigueOk},
    {key:"rom", label:"Range-of-motion confirmed by clinician", met:romOk},
    {key:"dosage", label:"All Phase "+patient.phase+" exercises at full dosage (3 sets of 10)", met:dosageOk}
  ];
  return {allMet: painOk && fatigueOk && romOk && dosageOk, criteria:criteria, mostRecentLog:mostRecent};
};

// Whether the 'sequential' progressionModel is currently withholding weighted resistance (Rule 3a)
// until the Phase 1 template is complete. Does not alter how the weighted table itself works.
Rules.weightedProgressionLocked = function(patient){
  return patient.progressionModel==="sequential" && patient.phase<2;
};

// Placeholder pacing algorithm (validated in an interactive demo — match this exactly, don't
// reinterpret): on a completed session with pain<5 AND fatigue<5 (that day's log — see the
// "effect of the previous session" framing on the daily log form), advances exactly ONE exercise
// in phaseDosage by one set, round-robin through the list in order, skipping any already at
// target, capped at targetSets. If pain>=5 or fatigue>=5, holds dosage steady for that session
// (same load-reduction spirit as the stop/regression rule). A more clinically real version —
// tracking actual per-exercise sets/reps the patient reports, gated by dosageFrequencyDays — is a
// reasonable future iteration, not what this implements. Mutates patient.phaseDosage directly,
// same pattern as Rules.advanceProgression above; only ever called from a completed-session save.
Rules.advancePhaseDosage = function(patient, log){
  if(log.pain>=5 || log.fatigue>=5) return null;
  var next = patient.phaseDosage.find(function(d){ return d.currentSets<d.targetSets; });
  if(!next) return null;
  next.currentSets = Math.min(next.targetSets, next.currentSets+1);
  return next.name;
};

// Rule 6: program composition audit
Rules.programCompositionAudit = function(patient){
  return CATEGORIES.filter(function(cat){
    return !patient.program.some(function(e){ return e.category===cat; });
  });
};

// Rule 7: session-split suggestion -- operates on individual sessions, not days, now that a day
// can hold more than one (see Actions.startWorkout/submitSessionWrapup): a patient doing two
// easier sessions a day should read the same as one day with an equally easy single session, not
// get double-counted or hidden by which day it landed on.
Rules.sessionSplitSuggestion = function(patient){
  var recentDays = patient.dailyLogs.filter(function(l){ return l.sessions && l.sessions.length; })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var recentSessions = [];
  recentDays.forEach(function(l){ l.sessions.forEach(function(s){ recentSessions.push(s.rpe); }); });
  recentSessions = recentSessions.slice(-10);
  if(recentSessions.length<3) return {suggest:false, avgRpe:null, count:recentSessions.length};
  var mean = avg(recentSessions);
  return {suggest: mean>5, avgRpe:mean, count:recentSessions.length};
};

// IBM-specific: IBMFRS meaningful-decline flag. Higher IBMFRS totals are better, so a decline is a
// negative delta; the published threshold is a drop of >=2 points on the total between the two most
// recent itemized entries. Informational only, like every other alert in this app — never an
// automatic action.
Rules.ibmfrsDeclineFlag = function(patient){
  var entries = patient.fom.filter(function(f){ return Array.isArray(f.ibmfrsItems); })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(entries.length<2) return {triggered:false, hasData:entries.length>0};
  var prev = entries[entries.length-2], curr = entries[entries.length-1];
  var delta = curr.ibmfrsTotal - prev.ibmfrsTotal;
  var result = {triggered:false, hasData:true, delta:delta, previousTotal:prev.ibmfrsTotal, currentTotal:curr.ibmfrsTotal, previousDate:prev.date, currentDate:curr.date};
  if(delta<=-2){
    result.triggered = true;
    result.message = "IBMFRS dropped by "+(-delta)+" points since last visit — exceeds the published meaningful-decline threshold.";
  }
  return result;
};

window.Rules = Rules; // exposed for manual/console testing

/* ======================== Charts (inline SVG, no external library) ======================== */
function svgLineChart(series, opts){
  opts = opts||{};
  var w = opts.width||560, h = opts.height||180, pad = {t:14,r:14,b:26,l:38};
  var allPoints = [];
  series.forEach(function(s){ s.points.forEach(function(p){ allPoints.push(p); }); });
  if(!allPoints.length) return '<div class="muted">No data yet.</div>';
  var dates = allPoints.map(function(p){return p.date;}).sort();
  var minDate = dates[0], maxDate = dates[dates.length-1];
  var values = allPoints.map(function(p){return p.value;});
  var yMin = opts.yMin!=null ? opts.yMin : Math.min.apply(null, values);
  var yMax = opts.yMax!=null ? opts.yMax : Math.max.apply(null, values);
  if(yMin===yMax){ yMin -= 1; yMax += 1; }
  var span = daysBetween(minDate,maxDate)||1;
  function x(date){ return pad.l + (daysBetween(minDate,date)/span) * (w-pad.l-pad.r); }
  function y(val){ return h-pad.b - ((val-yMin)/(yMax-yMin)) * (h-pad.t-pad.b); }
  var svg = '<svg class="chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">';
  // axes
  svg += '<line x1="'+pad.l+'" y1="'+(h-pad.b)+'" x2="'+(w-pad.r)+'" y2="'+(h-pad.b)+'" stroke="#d8e0e6"/>';
  svg += '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(h-pad.b)+'" stroke="#d8e0e6"/>';
  svg += '<text x="4" y="'+(y(yMax)+4)+'">'+ (Math.round(yMax*100)/100) +'</text>';
  svg += '<text x="4" y="'+(y(yMin)+4)+'">'+ (Math.round(yMin*100)/100) +'</text>';
  svg += '<text x="'+pad.l+'" y="'+(h-6)+'">'+fmtDate(minDate)+'</text>';
  svg += '<text x="'+(w-pad.r-54)+'" y="'+(h-6)+'">'+fmtDate(maxDate)+'</text>';
  series.forEach(function(s){
    var pts = s.points.slice().sort(function(a,b){return a.date<b.date?-1:1;});
    if(!pts.length) return;
    var path = pts.map(function(p,i){ return (i===0?"M":"L")+x(p.date).toFixed(1)+","+y(p.value).toFixed(1); }).join(" ");
    svg += '<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="2"/>';
    pts.forEach(function(p){
      svg += '<circle cx="'+x(p.date).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="3" fill="'+s.color+'"><title>'+fmtDate(p.date)+': '+p.value+'</title></circle>';
    });
  });
  svg += '</svg>';
  var legend = '<div class="legend">'+series.map(function(s){
    return '<span><i style="background:'+s.color+'"></i>'+escapeHtml(s.name)+'</span>';
  }).join("")+'</div>';
  return '<div class="chart-wrap">'+svg+legend+'</div>';
}

// Compact axis-free line, used for the IBMFRS per-item small multiples.
function svgSparkline(points, opts){
  opts = opts||{};
  var w = opts.width||120, h = opts.height||34, color = opts.color||"#2563a6";
  var yMin = opts.yMin!=null?opts.yMin:0, yMax = opts.yMax!=null?opts.yMax:4;
  if(!points.length) return '<div class="muted" style="font-size:11px;">No data</div>';
  var pts = points.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var minDate = pts[0].date, maxDate = pts[pts.length-1].date, span = daysBetween(minDate,maxDate)||1;
  function x(d){ return 4 + (daysBetween(minDate,d)/span) * (w-8); }
  function y(v){ return h-4 - ((v-yMin)/((yMax-yMin)||1)) * (h-8); }
  var path = pts.map(function(p,i){ return (i===0?"M":"L")+x(p.date).toFixed(1)+","+y(p.value).toFixed(1); }).join(" ");
  var circles = pts.map(function(p){
    return '<circle cx="'+x(p.date).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="2.2" fill="'+color+'"><title>'+fmtDate(p.date)+': '+p.value+'</title></circle>';
  }).join("");
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>'+circles+'</svg>';
}

// ---- Backend-backed sharing (magic-link PT access) ----
Actions.loadSharingStatus = function(patientId){
  fetch(sharingApiUrl("/api/patients/"+patientId+"/sharing/status"))
    .then(function(res){ if(!res.ok) throw new Error("status "+res.status); return res.json(); })
    .then(function(data){
      State.sharingStatusByPatient[patientId] = data;
      State.sharingError = null;
      render();
    })
    .catch(function(err){
      State.sharingError = "Couldn't reach the sharing backend ("+err.message+").";
      render();
    });
};

Actions.enableSharing = function(ev){
  ev.preventDefault();
  var f = ev.target;
  var patientId = State.patientId;
  var ptName = f.ptName.value.trim(), ptEmail = f.ptEmail.value.trim();
  if(!ptName || !ptEmail) return;
  State.sharingBusy = true; State.sharingError = null; render();
  fetch(sharingApiUrl("/api/patients/"+patientId+"/sharing/enable"), {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ptName:ptName, ptEmail:ptEmail})
  })
    .then(function(res){ return res.json().then(function(data){ return {ok:res.ok, status:res.status, data:data}; }); })
    .then(function(result){
      State.sharingBusy = false;
      if(!result.ok){
        State.sharingError = result.status===429
          ? "Too many sharing emails sent recently. Try again in about "+Math.ceil(result.data.retryAfterSeconds/60)+" minute(s)."
          : (result.data.error || "Couldn't turn on sharing.");
        render(); return;
      }
      State.sharingStatusByPatient[patientId] = {sharingEnabled:result.data.sharingEnabled, link:result.data.link};
      var p = getPatient(patientId); p.sharingEnabled = true; saveData();
      render();
    })
    .catch(function(err){
      State.sharingBusy = false;
      State.sharingError = "Couldn't reach the sharing backend ("+err.message+").";
      render();
    });
};

// Daily Log now only covers "how are you feeling" on its own -- it no longer doubles as the
// trigger for a workout (see Actions.startWorkout for that). Saving here never touches
// completed/rpe/exerciseRpes, so it's safe to submit before OR after a workout already logged
// today: it only ever updates the feeling fields on whatever entry exists for today, creating one
// (completed:false) if this is the first thing logged today.
Actions.saveDailyLog = function(ev){
  ev.preventDefault();
  var f = ev.target;
  var p = getPatient(State.patientId);
  var date = todayISO();
  var existing = p.dailyLogs.find(function(l){ return l.date===date; });
  var entry = existing || {date:date, logged:true, completed:false, sessions:[]};
  entry.logged = true;
  entry.pain = Number(f.pain.value);
  entry.fatigue = Number(f.fatigue.value);
  entry.postExerciseRelated = f.postExerciseRelated.checked;
  entry.adlImpact = f.adlImpact.checked;
  if(!existing) p.dailyLogs.push(entry);
  saveData();
  render();
};

// Entry point for starting today's exercise session -- from the Dashboard's primary CTA, or the
// shortcut on the Daily Log page. Jumps straight into the per-exercise walkthrough (picture,
// video, pacing timer, sets/reps, Borg RPE) with no form to fill out first; pain/fatigue and the
// two follow-up questions are asked once, at the end, as part of Actions.submitSessionWrapup --
// see the per-exercise flow below for how that walkthrough itself works.
Actions.startWorkout = function(patientId){
  var p = getPatient(patientId);
  State.exerciseLogRevealed = false;
  if(p.phaseDosage && p.phaseDosage.length){
    State.exerciseRpeFlow = {patientId:p.id, index:0, ratings:[]};
  } else {
    State.pendingRpePrompt = {patientId:p.id, exerciseRpes:[]};
  }
  // Autoplay this exercise's video for exactly the one render that first shows it -- see
  // renderExerciseMedia/exerciseJustArrived for why it's flipped back off immediately after.
  State.exerciseJustArrived = true;
  render();
  State.exerciseJustArrived = false;
};

// Advances the per-exercise walkthrough to the next exercise, or -- once every exercise has been
// rated -- hands off to the whole-session Borg RPE prompt. Also resets exerciseLogRevealed so
// the next exercise starts minimal (goal + video only) instead of carrying over the previous
// exercise's already-revealed logging section.
function advanceExerciseRpeFlow(){
  State.exerciseLogRevealed = false;
  var flow = State.exerciseRpeFlow;
  var p = getPatient(flow.patientId);
  flow.index += 1;
  if(flow.index < p.phaseDosage.length){
    // Autoplay the next exercise's video for exactly this one render -- see Actions.startWorkout
    // for why the flag is flipped back off immediately after.
    State.exerciseJustArrived = true;
    render();
    State.exerciseJustArrived = false;
  } else {
    State.pendingRpePrompt = {patientId:flow.patientId, exerciseRpes:flow.ratings};
    State.exerciseRpeFlow = null;
    render();
  }
}
Actions.submitExerciseRpe = function(ev){
  ev.preventDefault();
  var f = ev.target;
  // The RPE value lives on a hidden input (see renderRpeButtons) that HTML5 "required" can't
  // reliably enforce, so check it explicitly here instead.
  if(f.rpe.value===""){
    alert("Please tap a number to rate how hard that exercise felt (Borg RPE).");
    return;
  }
  var flow = State.exerciseRpeFlow;
  var p = getPatient(flow.patientId);
  var exercise = p.phaseDosage[flow.index];
  flow.ratings.push({
    name:exercise.name,
    setsCompleted: Number(f.setsCompleted.value),
    repsCompleted: Number(f.repsCompleted.value),
    rpe: Number(f.rpe.value)
  });
  advanceExerciseRpeFlow();
};
// Lets the patient back out of the workout walkthrough entirely -- e.g. they started it by
// mistake, got interrupted, or simply don't want to continue. Confirms first since exercises
// already rated earlier in this walkthrough (flow.ratings) only get saved once the whole-session
// wrap-up is submitted at the very end, so exiting early discards them -- same
// irreversible-action pattern as the app's other confirm() prompts (e.g. Actions.resetDemoData).
Actions.exitWorkout = function(){
  if(!confirm("Exit this workout? Any exercises you’ve already logged this session won’t be saved.")) return;
  State.exerciseRpeFlow = null;
  State.pendingRpePrompt = null;
  State.exerciseLogRevealed = false;
  render();
};

// Lets the patient skip just the CURRENT exercise (pain, fatigue, ran out of time, etc.) and move
// straight on to the next one -- unlike Actions.exitWorkout, the rest of the session continues.
// Recorded with skipped:true, no sets/reps/rpe, so the history table and session summary can show
// "skipped" instead of a misleading 0×0 reps / RPE 0. Rules.advancePhaseDosage doesn't read
// exerciseRpes at all (it just finds the first phaseDosage entry still below target), so skipping
// one exercise's rating has no side effect on dosage progression either way.
Actions.skipExercise = function(){
  var flow = State.exerciseRpeFlow;
  var p = getPatient(flow.patientId);
  var exercise = p.phaseDosage[flow.index];
  flow.ratings.push({name:exercise.name, skipped:true});
  advanceExerciseRpeFlow();
};

// Lets the patient step back to the exercise they just came from (misclicked "skip" or "done",
// or want to redo it) -- only ever available once they're past the first exercise. flow.ratings
// always holds exactly one entry per exercise already stepped through (pushed by
// submitExerciseRpe/skipExercise right before the index advances), so the entry for the exercise
// we're returning to is always the LAST one -- popping it discards that already-recorded result
// and lets the patient log it again fresh, same as if they'd never gone past it.
Actions.goToPreviousExercise = function(){
  var flow = State.exerciseRpeFlow;
  if(!flow || flow.index<=0) return;
  flow.index -= 1;
  flow.ratings.pop();
  State.exerciseLogRevealed = false;
  State.exerciseJustArrived = true;
  render();
  State.exerciseJustArrived = false;
};

// ---- Accessible sets/reps entry: "did you hit the goal?" Yes/No first, numbers only if needed ----
// Defaults to the lowest-effort path: the number inputs already default to the exercise's goal
// (see the form fields below), so confirming "Yes" just locks those defaults in -- zero typing,
// zero counting -- for the common case of a patient doing exactly what was prescribed. Only a
// patient who did more or less ever needs to touch a number, at which point the stepper UI
// (unchanged from before) appears pre-filled with the goal as a starting point to nudge from.
// This keeps the underlying data (actual sets/reps, not just a yes/no) for Rules.advancePhaseDosage
// and the history table either way -- a pure yes/no with no fallback would lose the difference
// between "fell just short" and "barely started," which matters clinically.
Actions.confirmGoalMet = function(){
  var setsInput = document.getElementById("setsCompletedInput");
  var repsInput = document.getElementById("repsCompletedInput");
  if(setsInput) setsInput.value = setsInput.defaultValue;
  if(repsInput) repsInput.value = repsInput.defaultValue;
  document.getElementById("goalAsk").style.display = "none";
  document.getElementById("goalAdjustFields").style.display = "none";
  document.getElementById("goalYesConfirmed").style.display = "block";
  Actions.speak("Goal met");
};
Actions.showGoalAdjust = function(){
  document.getElementById("goalAsk").style.display = "none";
  document.getElementById("goalYesConfirmed").style.display = "none";
  document.getElementById("goalAdjustFields").style.display = "block";

};
Actions.reopenGoalAsk = function(){

  document.getElementById("goalAdjustFields").style.display = "none";
  document.getElementById("goalAsk").style.display = "block";
};
// Reveals the goal-confirmation/RPE logging section. Hidden by default so the exercise screen
// starts minimal (just the name, goal, video, and home program PDF -- not a wall of inputs
// before the patient has even started). Direct DOM show/hide rather than a full render() so it
// doesn't reload the embedded video iframe mid-playback.
Actions.revealExerciseLog = function(){

  var trigger = document.getElementById("exerciseLogTrigger");
  var wrap = document.getElementById("exerciseLogWrap");
  if(trigger) trigger.style.display = "none";
  if(wrap) wrap.style.display = "block";

// ---- Accessible sets/reps entry (stepper buttons + spoken count) ----
// A patient with hand weakness or fatigue may find a tiny number-spinner or typing on a phone
// keyboard harder than tapping a large button -- these +/- buttons sit beside the existing
// number input and just nudge its value directly (no full render per tap, same
// "don't re-render mid-interaction" reasoning as the pacing slider), so the input itself stays
// the single source of truth the form already reads on submit. Speaking the new count aloud
// (built into every modern browser, no external service) means they don't have to look at the
// screen to confirm a tap registered -- useful mid-exercise, e.g. lying down for a supine set.
// Entirely optional: the number input can still be typed into directly, and audio can be muted.
Actions.stepCounterInput = function(inputId, delta){
  var el = document.getElementById(inputId);
  if(!el) return;
  var min = el.min!==""?Number(el.min):0, max = el.max!==""?Number(el.max):999;
  var next = Math.max(min, Math.min(max, (Number(el.value)||0) + delta));
  el.value = next;
  Actions.speak(next);
};
Actions.toggleCounterAudio = function(){
  State.counterAudioOn = !State.counterAudioOn;
  render();
};
Actions.speak = function(text){
  if(!State.counterAudioOn) return;
  if(!window.speechSynthesis || typeof SpeechSynthesisUtterance==="undefined") return;
  try{
    window.speechSynthesis.cancel(); // don't let rapid taps queue up a backlog of utterances
    var u = new SpeechSynthesisUtterance(String(text));
    u.rate = 1.1;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech synthesis unavailable/blocked -- silently skip, it's a nice-to-have */ }
};

// ---- Accessible 0-10 scale entry (large tap-to-select buttons instead of typing a number) ----
// Used for Borg RPE, pain, and fatigue alike -- all three are the same 0-10 scale shape, and in
// all three a lower number is clinically milder/better, so the same green/amber/red banding
// (not a clinical threshold -- just a visual grouping) applies consistently to each. A row of big
// buttons is easier to hit precisely than a number input, especially one-handed or with reduced
// grip strength. Mirrors the Yes/No check-in buttons' direct-DOM-manipulation pattern
// (Actions.setCheckinConcern) rather than a full render per tap.
Actions.selectScaleValue = function(btn, fieldName, val){
  var form = btn.closest("form");
  form.querySelector('input[name="'+fieldName+'"]').value = val;
  Array.prototype.forEach.call(btn.parentElement.querySelectorAll("button"), function(b){
    b.classList.remove("selected");
  });
  btn.classList.add("selected");
};
function renderScaleButtons(fieldName, preselected){
  var html = '<input type="hidden" name="'+fieldName+'" value="'+(preselected!=null?preselected:"")+'">';
  html += '<div class="rpe-grid">';
  for(var n=0;n<=10;n++){
    var band = n<=3?"rpe-low":(n<=6?"rpe-mid":"rpe-high");
    var isSelected = preselected!=null && Number(preselected)===n;
    html += '<button type="button" class="'+band+(isSelected?" selected":"")+'" onclick="Actions.selectScaleValue(this,\''+fieldName+'\','+n+')">'+n+'</button>';
  }
  html += '</div>';
  return html;
}
// Plain-English anchors for the Borg RPE (rate of perceived exertion) scale -- these are the
// standard published verbal descriptors for the Borg CR10 scale (0 "nothing at all" through 10
// "maximal"), grouped into the same 3 color bands as the number buttons below (see .rpe-low/
// .rpe-mid/.rpe-high) instead of one long sentence, so a patient can match a button's color to
// its meaning at a glance rather than having to cross-reference dense text above 11 buttons.
var BORG_RPE_LEGEND = '<div class="rpe-chip-row">'+
  '<span class="rpe-chip rpe-low" title="0 nothing at all · 1–2 very light · 3 light">0–3 Light</span>'+
  '<span class="rpe-chip rpe-mid" title="4 light-moderate · 5–6 moderate">4–6 Moderate</span>'+
  '<span class="rpe-chip rpe-high" title="7–8 hard · 9 very hard · 10 maximal, couldn’t do more">7–10 Hard</span>'+
'</div>';

// End-of-session wrap-up: whole-session Borg RPE plus pain/fatigue and the two follow-up
// questions, all in one screen, submitted together once the workout itself is done. Finds or
// creates today's dailyLogs entry -- a workout started via Actions.startWorkout may not have one
// yet, since nothing about the session is saved until this final step (consistent with how the
// per-exercise sets/reps/RPE data was already only ever saved here, not mid-walkthrough).
Actions.submitSessionWrapup = function(ev){
  ev.preventDefault();
  var f = ev.target;
  // RPE/pain/fatigue all live on hidden inputs now (see renderScaleButtons) that HTML5
  // "required" can't reliably enforce, so check them explicitly here instead.
  if(f.rpe.value===""){ alert("Please tap a number for Borg RPE (how hard the session felt)."); return; }
  if(f.pain.value===""){ alert("Please tap a number for your pain level right now."); return; }
  if(f.fatigue.value===""){ alert("Please tap a number for your fatigue level right now."); return; }
  var patientId = State.pendingRpePrompt.patientId;
  var exerciseRpes = State.pendingRpePrompt.exerciseRpes;
  var p = getPatient(patientId);
  var date = todayISO();
  var existing = p.dailyLogs.find(function(l){ return l.date===date; });
  var entry = existing || {date:date, logged:true, sessions:[]};
  if(!Array.isArray(entry.sessions)) entry.sessions = [];
  entry.logged = true;
  entry.pain = Number(f.pain.value);
  entry.fatigue = Number(f.fatigue.value);
  entry.postExerciseRelated = f.postExerciseRelated.checked;
  entry.adlImpact = f.adlImpact.checked;
  var session = {rpe: Number(f.rpe.value), exerciseRpes: exerciseRpes, loggedAt: nowISOTime()};
  entry.sessions.push(session);
  entry.completed = true;
  if(!existing) p.dailyLogs.push(entry);

  var advancedExerciseName = Rules.advancePhaseDosage(p, entry);
  State.pendingRpePrompt = null;
  State.postSessionSummary = {patientId:p.id, rpe:session.rpe, pain:entry.pain, fatigue:entry.fatigue, exerciseRpes:exerciseRpes, advancedExerciseName:advancedExerciseName, sessionNumber:entry.sessions.length};

  saveData(); render();
};

Actions.confirmAdvance = function(patientId, exerciseId){

  if(Rules.weightedProgressionLocked(p)){

    return;

    ? "Criteria met. Confirm advancing \""+ex.name+"\" to the next step?"
    : "Criteria not yet met for \""+ex.name+"\". Advance anyway based on clinical judgment?";

Actions.pdfFileChosen = function(input){
  var file = input.files[0];
  if(!file) return;
  State.pdfError = null;
  var reader = new FileReader();
  reader.onload = function(){
    var typedArray = new Uint8Array(reader.result);
    if(typeof pdfjsLib === "undefined"){
      State.pdfError = "PDF library failed to load from CDN (no network access?). Try again when online.";
      render(); return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdfjsLib.getDocument({data:typedArray}).promise.then(function(doc){
      var pagePromises = [];
      for(var i=1;i<=doc.numPages;i++){
        pagePromises.push(doc.getPage(i).then(function(page){
          return page.getTextContent().then(function(tc){
            return tc.items.map(function(it){ return it.str; }).join("\n");
          });
        }));
      }
      return Promise.all(pagePromises);
    }).then(function(pagesText){
      var fullText = pagesText.join("\n");
      State.pdfReview = heuristicParseHep(fullText);
      render();
    }).catch(function(err){
      State.pdfError = "Could not parse this PDF: "+err.message;
      render();
    });
  };
  reader.readAsArrayBuffer(file);
};

function heuristicParseHep(text){
  var rawLines = text.split(/\n/).map(function(l){ return l.trim(); }).filter(function(l){ return l.length>0; });
  var keywordRe = /(\d+\s*(x|reps|sets|sec|seconds|min|minutes)\b)|(\bx\s*\d+)/i;
  var items = [];
  var current = null;
  rawLines.forEach(function(line){
    var looksLikePrescription = keywordRe.test(line);
    var looksLikeName = !looksLikePrescription && line.length<60 && /[a-zA-Z]/.test(line);
    if(looksLikeName){
      if(current) items.push(current);
      current = {name:line, prescription:"", category:"Core"};
    } else if(current){
      current.prescription = (current.prescription ? current.prescription+" " : "") + line;
    } else {
      current = {name:line.slice(0,50), prescription:"", category:"Core"};
    }
  });
  if(current) items.push(current);
  return items.filter(function(it){ return it.name; }).map(function(it,i){
    return {id:"parsed_"+i, name:it.name, prescription:it.prescription || "(review — no prescription detected)", category:"Core", include:true};
  });
}

/* ======================== Render: shared ======================== */
