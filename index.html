/* ======================== Render: Patient role ======================== */
function renderPatientRole(){
  var p = getPatient(State.patientId);
  var tabs = [["dashboard","Dashboard"],["log","Daily Log"],["program","My Program"],["library","Exercise Library"],["trends","Trends"],["sharing","Sharing"]];
  var html = '<main>';
  html += '<div class="tabs">'+tabs.map(function(t){
    return '<button class="'+(State.patientView===t[0]?"active":"")+'" onclick="Actions.setPatientView(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join("")+'</div>';

  var gate = Rules.gateCheck(p);
  if(gate.blocked){
    html += '<div class="alert alert-warning"><h4>⚠ '+gate.message+'</h4>'+gate.reason+' Please contact your PT or physician before continuing your program.</div>';
  }
  var stop = Rules.stopRegressionCheck(p);
  if(stop.triggered){
    html += '<div class="stop-banner">⛔ '+stop.message+'<div class="sub">Pain or fatigue ≥5 for 3 days in a row, with today affecting your daily activities and building on recent exercise. Please do not continue exercising until you’ve spoken with your PT or physician.</div></div>';
  }

  // Missed-log check-in modal
  var missed = Rules.missedLogCheck(p);
  if(missed.shouldPrompt && p.lastMissedLogPromptHandledDate!==todayISO()){
    html += renderCheckinModal(p, missed);
  }

  // Started via Actions.startWorkout: walk through each exercise asking Borg RPE, one at a time,
  // then the whole-session wrap-up (overall Borg RPE + pain/fatigue + follow-up questions).
  if(State.exerciseRpeFlow){
    html += renderExerciseRpePrompt();
  } else if(State.pendingRpePrompt){
    html += renderSessionWrapupPrompt();
  }

  // Post-session encouragement modal (shown once Borg RPE has been submitted)
  if(State.postSessionSummary){
    html += renderPostSessionModal();
  }

  if(State.patientView==="dashboard") html += renderPatientDashboard(p);
  else if(State.patientView==="log") html += renderPatientLog(p);
  else if(State.patientView==="program") html += renderPatientProgram(p);
  else if(State.patientView==="library") html += renderLibrary();
  else if(State.patientView==="trends") html += renderPatientTrends(p);
  else if(State.patientView==="sharing") html += renderSharing(p);

  html += '</main>';
  return html;
}

function renderCheckinModal(p, missed){
  if(!State.checkinDraft){
    return '<div class="modal-overlay"><div class="modal">'+
      '<h2>Welcome back!</h2>'+
      '<p>We haven’t seen a log from you in '+missed.daysSinceLastLog+' days (since '+fmtDate(missed.lastLogDate)+'). '+
      'If you’ve been doing well, no worries at all — just pick back up with today’s plan whenever you’re ready.</p>'+
      '<p class="muted">We’d also like a quick before/after check so we can keep an eye on how you’re doing.</p>'+
      '<div class="row" style="justify-content:flex-end;margin-top:14px;">'+
        '<button class="btn ghost" onclick="Actions.dismissCheckinNudge()">Skip for now</button>'+
        '<button class="btn" onclick="Actions.startCheckin()">Quick check-in</button>'+
      '</div>'+
    '</div></div>';
  }
  var lc = missed.lastCompletedLog;
  var draft = State.checkinDraft;
  return '<div class="modal-overlay"><div class="modal">'+
    '<h2>Quick check-in</h2>'+
    (lc ? '<p class="muted">After your last completed session on <strong>'+fmtDate(lc.date)+'</strong>, you logged pain <strong>'+lc.pain+'/10</strong> and fatigue <strong>'+lc.fatigue+'/10</strong>.</p>'
        : '<p class="muted">We don’t have a completed session on file yet.</p>')+
    '<form onsubmit="Actions.submitCheckin(event)">'+
      '<div class="grid">'+
        '<div class="field"><label>How is your pain right now? (0–10)</label><input type="number" name="currentPain" min="0" max="10" required></div>'+
        '<div class="field"><label>How is your fatigue right now? (0–10)</label><input type="number" name="currentFatigue" min="0" max="10" required></div>'+
      '</div>'+
      '<div class="field"><label>How have you been feeling?</label><textarea name="feeling" rows="2" placeholder="Anything you want your PT to know..."></textarea></div>'+
      '<div class="field"><label>Do you have any concerns you’d like your PT to know about?</label>'+
        '<div class="yesno">'+
          '<button type="button" class="'+(draft.concern==="yes"?"selected-yes":"")+'" onclick="Actions.setCheckinConcern(this,\'yes\')">Yes</button>'+
          '<button type="button" class="'+(draft.concern==="no"?"selected-no":"")+'" onclick="Actions.setCheckinConcern(this,\'no\')">No</button>'+
        '</div></div>'+
      '<div class="row" style="justify-content:flex-end;margin-top:10px;">'+
        '<button type="submit" class="btn" '+(draft.concern===null?"disabled":"")+'>Submit check-in</button>'+
      '</div>'+
    '</form>'+
  '</div></div>';
}

function renderPatientDashboard(p){
  var todayLog = p.dailyLogs.find(function(l){ return l.date===todayISO(); });
  var recentLogs = p.dailyLogs.filter(function(l){return l.logged;}).slice(-7);
  var adherenceNum = recentLogs.filter(function(l){return l.completed;}).length;
  var canExercise = !Rules.gateCheck(p).blocked && !Rules.stopRegressionCheck(p).triggered;
  var html = '<div class="card"><h2>Welcome back, '+escapeHtml(p.name)+'</h2>';
  html += '<p class="muted">Diagnosis subtype (demo field): '+escapeHtml(p.diagnosisSubtype)+' &middot; Target sessions: '+p.sessionsPerWeek+'/week &middot; Target RPE '+p.targetRPE.min+'–'+p.targetRPE.max+'</p>';

  // Primary call-to-action: starting a workout is the main thing a patient opens this app to do,
  // so it belongs front-and-center on the landing screen, not buried under Daily Log. Some
  // patients' programs call for more than one session a day, so the button stays available (just
  // relabeled) after a session is already logged today -- rather than disappearing, which left no
  // way to start a second one.
  var sessionCount = (todayLog && todayLog.sessions) ? todayLog.sessions.length : 0;
  if(canExercise){
    if(sessionCount>0){
      html += '<div class="alert alert-success">'+sessionCount+' session'+(sessionCount>1?"s":"")+' logged today. Thank you!</div>';
    }
    html += '<div style="text-align:center;padding:20px 10px;background:var(--primary-bg);border-radius:10px;margin-bottom:12px;">'+
      '<p style="margin:0 0 10px;font-weight:600;">'+(sessionCount>0?"Doing another session today?":"Ready for today’s session?")+'</p>'+
      '<button class="btn" style="padding:12px 28px;font-size:16px;" onclick="Actions.startWorkout(\''+p.id+'\')">▶ '+(sessionCount>0?"Start Another Session":"Start Today’s Workout")+'</button>'+
    '</div>';
    html += '<p class="muted" style="text-align:center;margin-top:-4px;">Not exercising'+(sessionCount>0?" again":"")+' today? <a href="#" onclick="Actions.setPatientView(\'log\'); return false;">Just log how you’re feeling</a></p>';
  } else {
    html += '<div class="alert alert-info">Exercise is on hold right now — see the alert above. You can still <a href="#" onclick="Actions.setPatientView(\'log\'); return false;">log how you’re feeling</a>.</div>';
  }

  html += '<p>Last 7 logged days: <strong>'+adherenceNum+'</strong> of <strong>'+recentLogs.length+'</strong> completed.</p>';
  html += '</div>';
  return html;
}

function renderPatientLog(p){
  var todayLog = p.dailyLogs.find(function(l){ return l.date===todayISO(); }) || {};
  var canExercise = !Rules.gateCheck(p).blocked && !Rules.stopRegressionCheck(p).triggered;
  var sessionCount = todayLog.sessions ? todayLog.sessions.length : 0;
  var html = '<div class="card"><h2>Daily Log — '+fmtDate(todayISO())+'</h2>';
  if(sessionCount>0){
    html += '<div class="alert alert-success">'+sessionCount+' session'+(sessionCount>1?"s":"")+' logged today. The fields below update how you’re feeling, not your sessions.</div>';
  }
  if(canExercise){
    html += '<p class="muted" style="margin-top:0;">'+(sessionCount>0?"Doing another session?":"Ready to exercise?")+' <button type="button" class="btn secondary" onclick="Actions.startWorkout(\''+p.id+'\')">▶ '+(sessionCount>0?"Start Another Session":"Start Today’s Workout")+'</button> No need to fill in the form below first.</p>';
  }
  html += '<form onsubmit="Actions.saveDailyLog(event)">';

  html += '<div class="grid">';
  html += '<div class="field"><label>Pain (0–10)</label><input type="number" name="pain" min="0" max="10" value="'+(todayLog.pain!=null?todayLog.pain:"")+'" required></div>';
  html += '<div class="field"><label>Fatigue (0–10)</label><input type="number" name="fatigue" min="0" max="10" value="'+(todayLog.fatigue!=null?todayLog.fatigue:"")+'" required></div>';
  html += '</div>';
  html += '<div class="field"><label><input type="checkbox" name="postExerciseRelated" '+(todayLog.postExerciseRelated?"checked":"")+'> This pain/fatigue is related to my last exercise session</label></div>';
  html += '<div class="field"><label><input type="checkbox" name="adlImpact" '+(todayLog.adlImpact?"checked":"")+'> This is affecting my daily activities</label></div>';

  html += '<button type="submit" class="btn">Save today’s log</button>';
  html += '</form></div>';

  html += '<div class="card"><h2>Recent history</h2><table><tr><th>Date</th><th>Sessions</th><th>Pain</th><th>Fatigue</th><th>Post-ex?</th><th>ADL impact?</th><th>Session details (RPE, sets×reps)</th></tr>';
  p.dailyLogs.filter(function(l){return l.logged;}).slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,14).forEach(function(l){
    var sessions = l.sessions || [];
    var detailHtml = sessions.length
      ? sessions.map(function(s, i){
          var exerciseSummary = (s.exerciseRpes && s.exerciseRpes.length)
            ? s.exerciseRpes.map(function(r){ return r.skipped ? r.name+" (skipped)" : r.name+" "+r.setsCompleted+"×"+r.repsCompleted+" RPE"+r.rpe; }).join(", ")
            : "—";
          var prefix = sessions.length>1 ? "Session "+(i+1)+" (RPE "+s.rpe+"): " : "RPE "+s.rpe+": ";
          return '<div>'+escapeHtml(prefix+exerciseSummary)+'</div>';
        }).join("")
      : "—";
    html += '<tr><td>'+fmtDate(l.date)+'</td><td>'+(sessions.length||"—")+'</td><td>'+l.pain+'</td><td>'+l.fatigue+'</td>'+
      '<td>'+(l.postExerciseRelated==null?"—":(l.postExerciseRelated?"Yes":"No"))+'</td>'+
      '<td>'+(l.adlImpact==null?"—":(l.adlImpact?"Yes":"No"))+'</td>'+
      '<td style="max-width:260px;">'+detailHtml+'</td></tr>';
  });
  html += '</table></div>';
  return html;
}

function renderPatientProgram(p){
  var html = renderPhaseProgressionCard(p, false);
  html += '<div class="card"><h2>Foundation Program</h2><p class="muted">Read-only — your PT manages changes to this program.</p>';
  p.program.forEach(function(ex){
    html += '<div class="exercise-item"><div class="head"><strong>'+escapeHtml(ex.name)+'</strong><span class="pill pill-'+ex.category.toLowerCase()+'">'+ex.category+'</span></div>';
    html += '<p>'+escapeHtml(ex.prescription)+'</p>';
    if(ex.progression){
      var st = Rules.progressionStatus(ex.progression);
      html += '<p class="muted">Step '+ex.progression.step+' of 4 &middot; '+ex.progression.currentReps+' reps @ '+ex.progression.currentWeight+' lb &middot; '+ex.progression.currentSets+' set(s)</p>';
      if(Rules.weightedProgressionLocked(p)){
        html += '<p class="muted">🔒 Weighted progression locked until Phase 2 (progression model: sequential).</p>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ---- Phase Progression rendering (shared between the patient Program tab and the
// clinician Program tab, so both stay visually and functionally identical) ----
function renderDosageBars(p){
  var html = "";
  p.phaseDosage.forEach(function(d){
    var pct = Math.round((d.currentSets/d.targetSets)*100);
    var complete = d.currentSets>=d.targetSets;
    html += '<div style="margin-bottom:8px;">'+
      '<div class="row" style="justify-content:space-between;"><span>'+escapeHtml(d.name)+'</span><span class="muted">'+d.currentSets+'/'+d.targetSets+' sets of '+d.targetReps+'</span></div>'+
      '<div class="progress-bar"><div class="progress-bar-fill'+(complete?" complete":"")+'" style="width:'+pct+'%;"></div></div>'+
    '</div>';
  });
  return html;
}
function renderPhaseCriteria(check){
  return '<ul class="criteria-list">'+check.criteria.map(function(c){
    return '<li class="'+(c.met?"met":"pending")+'">'+(c.met?"✅":"⏳")+' '+c.label+'</li>';
  }).join("")+'</ul>';
}
function renderPhaseProgressionCard(p, clinicianMode){
  var template = PHASE_TEMPLATES[p.phase];
  var check = Rules.checkPhaseAdvancement(p);
  var html = '<div class="card"><h2>Phase Progression — Phase '+p.phase+'</h2><p class="muted">'+template.label+'</p>';

  if(clinicianMode){
    html += '<div class="grid">';
    html += '<div class="field"><label>Progression model</label><select onchange="Actions.setProgressionModel(\''+p.id+'\',this.value)">'+
      '<option value="parallel"'+(p.progressionModel==="parallel"?" selected":"")+'>Parallel</option>'+
      '<option value="sequential"'+(p.progressionModel==="sequential"?" selected":"")+'>Sequential</option>'+
      '</select></div>';
    html += '<div class="field"><label>Dosage frequency</label><select onchange="Actions.setDosageFrequency(\''+p.id+'\',this.value)">'+
      [1,2,3].map(function(n){ return '<option value="'+n+'"'+(p.dosageFrequencyDays===n?" selected":"")+'>'+(n===1?"Every day":n===2?"Every other day":"Every 3rd day")+'</option>'; }).join("")+
      '</select></div>';
    html += '</div>';
    html += '<div class="toggle-row"><div><strong>ROM confirmed</strong><div class="muted">Stands in for the motion-capture ROM check (no real motion-capture input exists yet).</div></div>'+
      '<label class="switch"><input type="checkbox" '+(p.romConfirmed?"checked":"")+' onchange="Actions.toggleRomConfirmed(\''+p.id+'\')"><span class="slider"></span></label></div>';
  }

  html += '<h3>Dosage</h3>'+renderDosageBars(p);
  html += '<h3>Aerobic component</h3><p class="muted">'+escapeHtml(template.aerobic.name)+' — '+escapeHtml(template.aerobic.detail)+'</p>';

  if(p.phase<2){
    html += '<h3>Phase 2 advancement criteria</h3>'+renderPhaseCriteria(check);
    if(check.allMet){
      html += '<div class="success-banner">🎉 All Phase criteria met — your PT will review and confirm you’re ready for the next phase.</div>';
    }
    if(clinicianMode){
      html += '<button class="btn" '+(check.allMet?"":"disabled")+' onclick="Actions.confirmPhaseAdvance(\''+p.id+'\')">Confirm advance to Phase 2</button>';
    }
  }

  html += '</div>';
  return html;
}
// Asked once per exercise, immediately after the patient marks it done, before moving on to
// the next one -- see Actions.saveDailyLog/submitExerciseRpe for how this walkthrough is driven.
// Below the demo video sits a small row of still reference photos of someone actually
// performing this exercise, plus its one-sentence written description (EXERCISE_MEDIA.desc).
// Photos are deliberately pulled from the SAME video playing above -- YouTube auto-generates
// several numbered thumbnail frames per video (1.jpg/2.jpg/3.jpg, roughly its 25%/50%/75% marks,
// via img.youtube.com, no API key needed, same technique the Exercise Library already uses for
// its single thumbnail) -- rather than separately sourced photos, so every photo shown is
// guaranteed to match the video instead of risking a mismatched pose from a different source.
// Showing a few different frames (not just one) also means there's a much better chance at
// least one of them actually shows the exercise mid-motion, since any single frame can land on
// a title card or a talking-head intro instead. Falls back to the schematic pose illustration
// (EXERCISE_POSE_SVGS) for any exercise with no video yet, same fallback renderExerciseMedia
// uses.
function exercisePhotoUrls(ytId){
  return [1,2,3].map(function(n){ return "https://img.youtube.com/vi/"+ytId+"/"+n+".jpg"; });
}
function renderExercisePhoto(name){
  var m = EXERCISE_MEDIA[name];
  var ytId = m && m.videoUrl ? youTubeId(m.videoUrl) : null;
  var media, instructions;
  if(ytId){
    media = '<div style="display:flex;gap:6px;">'+
      exercisePhotoUrls(ytId).map(function(src, i){
        return '<img src="'+src+'" alt="'+escapeHtml(name)+' exercise photo '+(i+1)+'" loading="lazy" '+
          'style="width:'+(100/3)+'%;display:block;border-radius:8px;object-fit:cover;aspect-ratio:4/3;">';
      }).join('')+
    '</div>';
  } else if(m && EXERCISE_POSE_SVGS[m.pose]){
    media = EXERCISE_POSE_SVGS[m.pose];
  } else {
    media = '<div class="muted" style="text-align:center;padding:16px 0;font-size:12px;">No reference photo yet</div>';
  }
  instructions = (m && m.desc) ? m.desc : "No written instructions available yet -- follow the video above.";
  var nameAttr = escapeHtml(name).replace(/'/g, "&#39;");
  return '<div style="margin:14px 0;">'+
    '<div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:6px;">'+
      '<p class="muted" style="margin:0;font-weight:700;font-size:13px;">📷 Exercise Photo Reference</p>'+
      '<div class="row" style="gap:10px;">'+
        '<a href="#" onclick="Actions.showExerciseZoom(\''+nameAttr+'\'); return false;" style="font-size:12px;">🔍 View larger</a>'+
        '<a href="#" onclick="Actions.openExerciseReferenceTab(\''+nameAttr+'\'); return false;" style="font-size:12px;">↗ Open in new tab</a>'+
      '</div>'+
    '</div>'+
    media+
    // Scrollable so a longer future instruction doesn't push the rest of the page down -- the
    // text itself is one short sentence today, but this keeps the box a fixed, predictable size.
    '<div class="muted" style="margin-top:8px;font-size:13px;line-height:1.5;max-height:90px;overflow-y:auto;padding-right:4px;">'+escapeHtml(instructions)+'</div>'+
  '</div>';
}
// Builds the shared "photos + instructions" HTML used by both the in-app zoom overlay and the
// new-tab view -- one place for this markup instead of three slightly different copies.
function exerciseReferenceHtml(name, imgWidthPct){
  var m = EXERCISE_MEDIA[name];
  var ytId = m && m.videoUrl ? youTubeId(m.videoUrl) : null;
  var photosHtml = ytId
    ? '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        exercisePhotoUrls(ytId).map(function(src, i){
          return '<img src="'+src+'" alt="'+escapeHtml(name)+' exercise photo '+(i+1)+'" style="width:'+imgWidthPct+'%;border-radius:10px;display:block;object-fit:cover;aspect-ratio:4/3;">';
        }).join('')+
      '</div>'
    : (m && EXERCISE_POSE_SVGS[m.pose] ? '<div style="max-width:220px;margin:0 auto;">'+EXERCISE_POSE_SVGS[m.pose]+'</div>' : '');
  var instructions = (m && m.desc) ? m.desc : "No written instructions available yet -- follow the demo video for this exercise.";
  return photosHtml+'<p style="font-size:18px;line-height:1.6;margin-top:16px;">'+escapeHtml(instructions)+'</p>';
}
// Shows a larger, easier-to-read view of this exercise's photos + instructions, entirely as a
// DOM overlay appended directly to <body> -- NOT via State + render(), which would rebuild
// #app's whole innerHTML (including the live video iframe above) and restart it from 0:00. This
// way the overlay can sit on top of everything while the video keeps playing underneath,
// unaffected.
Actions.showExerciseZoom = function(name){
  Actions.closeExerciseZoom();
  var overlay = document.createElement("div");
  overlay.id = "exerciseZoomOverlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(20,25,35,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;";
  overlay.onclick = function(e){ if(e.target===overlay) Actions.closeExerciseZoom(); };
  overlay.innerHTML = '<div style="background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative;">'+
    '<button type="button" onclick="Actions.closeExerciseZoom()" aria-label="Close" '+
      'style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px;">✕</button>'+
    '<h2 style="margin:0 0 12px;padding-right:28px;">'+escapeHtml(name)+'</h2>'+
    exerciseReferenceHtml(name, 32)+
  '</div>';
  document.body.appendChild(overlay);
};
Actions.closeExerciseZoom = function(){
  var el = document.getElementById("exerciseZoomOverlay");
  if(el) el.remove();
};
// Opens the same photos + instructions in a genuinely separate tab/window via window.open('')
// + document.write -- not a data: URL (increasingly blocked as a top-level navigation target in
// modern browsers) and not a render() of this page. Because it's a brand-new window object,
// nothing in THIS page's DOM is touched, so the exercise video playing above keeps running the
// whole time, exactly as if the patient had switched to a different app entirely.
Actions.openExerciseReferenceTab = function(name){
  var w = window.open("", "_blank");
  if(!w) return; // popup blocked -- nothing more we can do here
  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+escapeHtml(name)+'</title>'+
    '<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:600px;margin:0 auto;padding:64px 16px 40px;color:#1c2530;}'+
    'img{border-radius:10px;}h1{font-size:22px;}'+
    // A patient opening this in a standalone installed-PWA context may have no browser chrome
    // (no back/close button of its own), so this page must supply its own obvious way out.
    // window.close() works here because this tab was opened by script (window.open), which is
    // exactly the case browsers allow a page to close itself.
    '.exit-tab-btn{position:fixed;top:12px;right:12px;background:#1c2530;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;}'+
    '</style></head><body>'+
    '<button type="button" class="exit-tab-btn" onclick="window.close()">✕ Close this tab</button>'+
    '<h1>'+escapeHtml(name)+'</h1>'+
    exerciseReferenceHtml(name, 31)+
    '</body></html>'
  );
  w.document.close();
};
function renderExerciseRpePrompt(){
  var flow = State.exerciseRpeFlow;
  var p = getPatient(flow.patientId);
  var exercise = p.phaseDosage[flow.index];
  var isLast = flow.index === p.phaseDosage.length-1;
  return '<div class="modal-overlay"><div class="modal" style="position:relative;">'+
    '<button type="button" onclick="Actions.exitWorkout()" aria-label="Exit workout" title="Exit workout" '+
      'style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px;">✕</button>'+
    '<h2 style="padding-right:28px;">'+escapeHtml(exercise.name)+'</h2>'+
    '<p class="muted" style="margin:0 0 8px;">Exercise '+(flow.index+1)+' of '+p.phaseDosage.length+'</p>'+
    '<div style="background:var(--primary-bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;text-align:center;">'+
      '<p style="margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Today’s goal</p>'+
      '<p style="margin:2px 0 0;font-size:22px;font-weight:800;color:var(--primary-dark);">'+exercise.currentSets+' sets × '+exercise.targetReps+' reps</p>'+
    '</div>'+
    // Sticky, not static: if the modal needs to scroll (e.g. once the logging section below is
    // revealed), the video stays pinned in view at the top of its own scroll container instead
    // of scrolling out of sight -- a small "mini player" that keeps playing throughout.
    '<div style="position:sticky;top:0;z-index:3;background:#fff;padding-bottom:6px;">'+
      renderExerciseMedia(exercise.name, 420, true, State.exerciseJustArrived)+
    '</div>'+
    renderExercisePhoto(exercise.name)+
    '<div id="exerciseLogTrigger" style="display:'+(!State.exerciseLogRevealed?"block":"none")+';text-align:center;margin:14px 0 4px;">'+
      '<button type="button" class="btn success" style="padding:12px 24px;font-size:15px;" onclick="Actions.revealExerciseLog()">✓ Click when you’re done</button>'+
    '</div>'+
    '<div class="row" style="justify-content:'+(flow.index>0?"space-between":"center")+';margin:6px 0 4px;">'+
      (flow.index>0 ? '<a href="#" onclick="Actions.goToPreviousExercise(); return false;" style="font-size:13px;color:var(--muted);">← Previous exercise</a>' : '')+
      '<a href="#" onclick="Actions.skipExercise(); return false;" style="font-size:13px;color:var(--muted);">Skip this exercise →</a>'+
    '</div>'+
    '<div id="exerciseLogWrap" style="display:'+(State.exerciseLogRevealed?"block":"none")+';">'+
    '<form onsubmit="Actions.submitExerciseRpe(event)">'+
      '<div class="row" style="justify-content:flex-end;margin:10px 0 -4px;">'+
        '<button type="button" class="btn ghost" style="padding:4px 10px;font-size:12px;" onclick="Actions.toggleCounterAudio()">'+(State.counterAudioOn?"🔊 Spoken count: on":"🔇 Spoken count: off")+'</button>'+
      '</div>'+
      '<div id="goalAsk" style="margin-bottom:10px;">'+
        '<p style="text-align:center;font-weight:600;margin:0 0 8px;">Did you complete '+exercise.currentSets+' sets × '+exercise.targetReps+' reps?</p>'+
        '<div class="row" style="justify-content:center;gap:10px;">'+
          '<button type="button" class="btn success" style="padding:12px 20px;font-size:15px;" onclick="Actions.confirmGoalMet()">✅ Yes, that’s right</button>'+
          '<button type="button" class="btn secondary" style="padding:12px 16px;font-size:14px;" onclick="Actions.showGoalAdjust()">I did more or less</button>'+
        '</div>'+

      '<div id="goalAdjustFields" style="display:none;">'+
        '<div class="grid">'+
          '<div class="field"><label>Sets completed</label>'+

// Pulls the video ID out of a youtube.com/watch?v=... URL so we can show the video's own real
// thumbnail (a real photo of a real person performing the exercise) instead of a drawn stick
// figure, via YouTube's public img.youtube.com thumbnail CDN (no API key needed, standard
// practice for link previews across the web). Non-YouTube links (and any exercise without a
// video yet) fall back to the stick-figure illustration -- there's no equivalent predictable
// thumbnail URL for an arbitrary site.
function youTubeId(url){
  var m = url && url.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function renderExerciseMedia(name, widthPx, embed, autoplay){
  var m = EXERCISE_MEDIA[name];
  var ytId = m && m.videoUrl ? youTubeId(m.videoUrl) : null;
  var media;
  if(ytId && embed){
    // True inline embed (plays right there in the app, no new tab) -- used on the per-exercise
    // session screen, where there's only ever one video on screen at a time. The Exercise Library
    // list keeps the lighter thumbnail+link version below, since loading 16 live YouTube players
    // at once would be unnecessarily heavy for a browsable reference list.
    // autoplay=1 only appears for the one render fired right as the patient arrives at this
    // exercise (State.exerciseJustArrived -- see Actions.startWorkout/advanceExerciseRpeFlow),
    // so the video starts playing the moment the session (or the next exercise) begins, without
    // needing a separate tap to press play. That flag clears immediately after, so a later
    // full render() of this same exercise (e.g. toggling the spoken-count setting) doesn't
    // restart the video from 0:00.
    media = '<div style="position:relative;padding-top:56.25%;border-radius:8px;overflow:hidden;background:#000;">'+
      '<iframe src="https://www.youtube.com/embed/'+ytId+(autoplay?"?autoplay=1":"")+'" title="'+escapeHtml(name)+' demo video" '+
        'style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" '+
        'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; autoplay" allowfullscreen loading="lazy"></iframe>'+
    '</div>';
  } else if(ytId){
    media = '<a href="'+escapeHtml(m.videoUrl)+'" target="_blank" rel="noopener noreferrer" style="display:block;position:relative;border-radius:8px;overflow:hidden;line-height:0;">'+
      '<img src="https://img.youtube.com/vi/'+ytId+'/hqdefault.jpg" alt="'+escapeHtml(name)+' demo video thumbnail" loading="lazy" style="width:100%;display:block;">'+
      '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);">▶</span>'+
    '</a>';
  } else if(m && EXERCISE_POSE_SVGS[m.pose]){
    media = EXERCISE_POSE_SVGS[m.pose];
  } else {
    media = '<div class="muted" style="text-align:center;padding:16px 0;font-size:12px;">No illustration yet</div>';
  }
  var caption;
  if(m && m.videoUrl){
    caption = ytId ? "" : '<a href="'+escapeHtml(m.videoUrl)+'" target="_blank" rel="noopener noreferrer" class="btn secondary" style="display:block;text-align:center;margin-top:6px;padding:4px 8px;font-size:12px;">▶ Watch demo video</a>';
    caption += '<p class="muted" style="text-align:center;margin:4px 0 0;font-size:10px;">'+(m.videoSource?"via "+escapeHtml(m.videoSource)+" &middot; ":"")+'not yet click-verified</p>';
    if(m.videoCaveat) caption += '<p class="muted" style="text-align:center;margin:2px 0 0;font-size:10px;font-style:italic;">'+escapeHtml(m.videoCaveat)+'</p>';
  } else {
    caption = '<p class="muted" style="text-align:center;margin-top:6px;font-size:11px;">No demo video yet</p>';
  }
  return '<div style="max-width:'+(widthPx||150)+'px;margin:0 auto;">'+media+caption+'</div>';
}

function renderLibrary(){
  var f = State.libraryFilter;
  var regions = ["All"].concat(Array.from(new Set(REFERENCE_EXERCISES.map(function(e){return e.region;}))));
  var items = REFERENCE_EXERCISES.filter(function(e){
    var matchesRegion = f.region==="All" || e.region===f.region;
    var matchesSearch = !f.search || (e.name+" "+e.desc).toLowerCase().indexOf(f.search.toLowerCase())>=0;
    return matchesRegion && matchesSearch;
  });
  var html = '<div class="card"><h2>Reference Exercise Library</h2><p class="muted">Informational only — browsing here never changes your actual program.</p>';
  html += '<div class="row" style="margin-bottom:12px;">';
  html += '<input type="text" placeholder="Search exercises..." value="'+escapeHtml(f.search)+'" oninput="Actions.setLibraryFilter(\'search\', this.value)">';
  html += '<select onchange="Actions.setLibraryFilter(\'region\', this.value)">'+regions.map(function(r){ return '<option value="'+r+'"'+(f.region===r?" selected":"")+'>'+r+'</option>'; }).join("")+'</select>';
  html += '</div>';
  if(!items.length) html += '<p class="muted">No exercises match your filters.</p>';
  items.forEach(function(e){
    html += '<div class="lib-item" style="display:flex;gap:12px;align-items:flex-start;">'+
      '<div style="flex:0 0 100px;">'+renderExerciseMedia(e.name, 100)+'</div>'+
      '<div style="flex:1;min-width:0;"><div class="region">'+e.region+' &middot; '+e.category+'</div><strong>'+e.name+'</strong><p class="muted" style="margin:4px 0 0;">'+e.desc+'</p><p class="muted" style="margin:2px 0 0;">Equipment: '+e.equipment+'</p></div>'+
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderPatientTrends(p){
  var html = '<div class="card"><h2>Adherence</h2>';
  var loggedRecent = p.dailyLogs.filter(function(l){return l.logged;});
  var completedRecent = loggedRecent.filter(function(l){return l.completed;});
  var pct = loggedRecent.length ? Math.round(100*completedRecent.length/loggedRecent.length) : 0;
  html += '<p>Overall adherence: <strong>'+pct+'%</strong> ('+completedRecent.length+' of '+loggedRecent.length+' logged days completed)</p></div>';

  html += '<div class="card"><h2>RPE / Pain / Fatigue over time</h2>';
  // RPE is plotted per session, not per day, now that a day can hold more than one (a day with
  // two sessions contributes two points at that date) -- pain/fatigue stay per-day, since they
  // represent the most recently reported feeling that day rather than a specific session.
  var rpePoints = [];
  p.dailyLogs.forEach(function(l){ (l.sessions||[]).forEach(function(s){ rpePoints.push({date:l.date, value:s.rpe}); }); });
  var series = [
    {name:"RPE", color:"#2563a6", points: rpePoints},
    {name:"Pain", color:"#b3241c", points: p.dailyLogs.filter(function(l){return l.logged;}).map(function(l){return {date:l.date,value:l.pain};})},
    {name:"Fatigue", color:"#9a6b00", points: p.dailyLogs.filter(function(l){return l.logged;}).map(function(l){return {date:l.date,value:l.fatigue};})}
  ];
  html += svgLineChart(series, {yMin:0, yMax:10});
  html += '</div>';

  html += '<div class="card"><h2>Functional outcome measures</h2>';
  if(!p.fom.length) html += '<p class="muted">No measures recorded yet.</p>';
  else{
    var patientMeasures = fomMeasuresFor(p);
    html += '<table><tr><th>Date</th>'+patientMeasures.map(function(m){return '<th>'+m.label+'</th>';}).join("")+'</tr>';
    p.fom.forEach(function(f){
      html += '<tr><td>'+fmtDate(f.date)+'</td>'+patientMeasures.map(function(m){return '<td>'+(f[m.key]!=null?f[m.key]:"—")+'</td>';}).join("")+'</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  return html;
}

function renderSharing(p){
  if(!SHARING_API_BASE) return renderSharingLocalOnly(p);

  var html = '<div class="card"><h2>Sharing Settings</h2>';
  html += '<p class="muted">This choice is always yours — the app will never override it.</p>';
  if(State.sharingError) html += '<div class="alert alert-warning">'+escapeHtml(State.sharingError)+'</div>';

  var status = State.sharingStatusByPatient[p.id];
  if(!status){
    html += '<p class="muted">Loading sharing status…</p></div>';
    return html;
  }

  var link = status.link;
  var linkStatus = link ? link.status : "none";

  if(status.sharingEnabled && link && linkStatus!=="none"){
    var statusPill = {active:"alert-success", expired:"alert-warning", revoked:"alert-danger", none:"alert-info"}[linkStatus] || "alert-info";
    html += '<div class="toggle-row"><div><strong>'+escapeHtml(link.ptName)+'</strong><div class="muted">'+escapeHtml(link.ptEmail)+'</div></div>'+
      '<label class="switch"><input type="checkbox" checked '+(State.sharingBusy?"disabled":"")+' onchange="Actions.disableSharing()"><span class="slider"></span></label></div>';

    html += '<div class="alert '+statusPill+'"><h4>Link status: '+linkStatus.charAt(0).toUpperCase()+linkStatus.slice(1)+'</h4>';
    html += 'Sent '+fmtDateTime(link.createdAt)+' &middot; expires '+fmtDateTime(link.expiresAt)+'<br>';
    html += link.lastAccessedAt
      ? 'Last viewed by your PT: '+fmtDateTime(link.lastAccessedAt)+' ('+link.accessCount+' view'+(link.accessCount===1?"":"s")+' total)'
      : 'Not yet viewed by your PT.';
    html += '</div>';

    if(linkStatus==="active" && link.url){
      html += '<div class="field"><label>Share link</label><input type="text" readonly value="'+escapeHtml(link.url)+'" onclick="this.select()"></div>';
    }

    html += '<div class="row">';
    if(linkStatus==="active"){
      html += '<button class="btn danger" '+(State.sharingBusy?"disabled":"")+' onclick="Actions.revokeSharing()">Revoke access</button>';
    }
    html += '<button class="btn secondary" '+(State.sharingBusy?"disabled":"")+' onclick="Actions.resendSharingLink()">Resend link'+(linkStatus!=="active"?" (new link)":"")+'</button>';
    html += '</div>';
  } else {
    html += '<p class="muted">Sharing is currently <strong>OFF</strong>. Turn it on and enter your local PT’s details to email them a secure, view-only link.</p>';
    html += '<form onsubmit="Actions.enableSharing(event)"><div class="grid">'+
      '<div class="field"><label>PT name</label><input type="text" name="ptName" required placeholder="e.g. Dana Kim, PT"></div>'+
      '<div class="field"><label>PT email</label><input type="text" name="ptEmail" required placeholder="pt@clinic.example"></div>'+
      '</div><button type="submit" class="btn" '+(State.sharingBusy?"disabled":"")+'>Turn on sharing &amp; send link</button></form>';
  }

  html += '</div>';
  return html;
}

// Fallback used only when SHARING_API_BASE is blank (no backend deployed/configured):
// a plain on/off toggle with no email, no revocable magic link, and no audit trail.

function renderClinicianRole(){
  var html = '<main>';
  if(State.clinicianView==="list"){
    html += renderClinicianList();
  } else {
    html += renderClinicianDetail(getPatient(State.clinicianSelectedPatientId));
  }
  html += '</main>';
  return html;
}

function renderClinicianList(){
  var shared = Data.patients.filter(function(p){ return p.sharingEnabled; });
  var html = '<div class="card"><h2>Patient List</h2><p class="muted">Only patients who have enabled sharing appear here.</p>';
  if(!shared.length) html += '<p class="muted">No patients are currently sharing data.</p>';
  shared.forEach(function(p){
    var stop = Rules.stopRegressionCheck(p);
    var gate = Rules.gateCheck(p);
    var badges = "";
    if(stop.triggered) badges += ' <span class="pill" style="background:#fdeceb;color:#b3241c;">STOP ALERT</span>';
    if(gate.blocked) badges += ' <span class="pill" style="background:#fff6df;color:#9a6b00;">NOT CLEARED</span>';
    html += '<div class="patient-card" onclick="Actions.openClinicianPatient(\''+p.id+'\')">'+
      '<div class="name">'+escapeHtml(p.name)+badges+'</div>'+
      '<div class="muted">'+escapeHtml(p.diagnosisSubtype)+' &middot; '+p.sessionsPerWeek+'x/week</div>'+
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderClinicianDetail(p){
  var html = '<button class="btn ghost" style="margin-bottom:12px;" onclick="Actions.backToPatientList()">← Back to patient list</button>';
  html += '<div class="card"><h2>'+escapeHtml(p.name)+'</h2><p class="muted">'+escapeHtml(p.diagnosisSubtype)+' &middot; Local PT: '+escapeHtml(p.localPtName)+' &middot; Target RPE '+p.targetRPE.min+'–'+p.targetRPE.max+'</p></div>';

  var tabs = [["alerts","Alerts"],["program","Program"],["fom","Functional Measures"],["mmt","MMT"],["clearance","Clearance / Flare"],["pdfimport","PDF Import"]];
  html += '<div class="tabs">'+tabs.map(function(t){
    return '<button class="'+(State.clinicianDetailTab===t[0]?"active":"")+'" onclick="Actions.setClinicianTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join("")+'</div>';

  if(State.clinicianDetailTab==="alerts") html += renderClinicianAlerts(p);
  else if(State.clinicianDetailTab==="program") html += renderClinicianProgram(p);
  else if(State.clinicianDetailTab==="fom") html += renderClinicianFom(p);
  else if(State.clinicianDetailTab==="mmt") html += renderClinicianMmt(p);
  else if(State.clinicianDetailTab==="clearance") html += renderClinicianClearance(p);
  else if(State.clinicianDetailTab==="pdfimport") html += renderPdfImport(p);
  return html;
}

function renderClinicianAlerts(p){
  var html = '<div class="card"><h2>Rule Engine Alerts</h2>';

  var gate = Rules.gateCheck(p);
  html += gate.blocked
    ? '<div class="alert alert-warning"><h4>Gate check: '+gate.message+'</h4>'+gate.reason+'</div>'
    : '<div class="alert alert-success"><h4>Gate check: cleared</h4>Patient is cleared for exercise and not currently in flare.</div>';

  var stop = Rules.stopRegressionCheck(p);
  html += stop.triggered
    ? '<div class="stop-banner">⛔ '+stop.message+'<div class="sub">3 consecutive logged days with pain or fatigue ≥5, and today’s log shows progressive symptoms with ADL impact.</div></div>'
    : '<div class="alert alert-success"><h4>Stop/regression: not triggered</h4>No qualifying 3-day pattern detected.</div>';

  var missed = Rules.missedLogCheck(p);
  if(missed.shouldPrompt){
    html += '<div class="alert alert-warning"><h4>Missed-log check-in pending</h4>No log in '+missed.daysSinceLastLog+' days (since '+fmtDate(missed.lastLogDate)+'). The patient will see a check-in prompt next time they open the app.</div>';
  } else {
    html += '<div class="alert alert-success"><h4>Logging: up to date</h4></div>';
  }
  var flaggedCheckins = p.checkinAlerts.filter(function(c){ return Rules.checkinConcernFlag(c); });
  if(flaggedCheckins.length){
    flaggedCheckins.slice().reverse().forEach(function(c){
      html += '<div class="alert alert-danger"><h4>Flagged check-in — '+fmtDate(c.date)+'</h4>'+
        'After-session pain/fatigue: '+c.afterSessionPain+'/'+c.afterSessionFatigue+' &middot; Current pain/fatigue: '+c.currentPain+'/'+c.currentFatigue+
        (c.feeling?('<br>"'+escapeHtml(c.feeling)+'"'):'')+
        (c.concernNoted?'<br><strong>Patient indicated a direct concern.</strong>':'')+'</div>';
    });
  }

  var recovery = Rules.recoveryTimeFlags(p);
  if(recovery.length){
    html += '<div class="alert alert-info"><h4>Recovery-time follow-up</h4><ul class="flag-list">';
    recovery.forEach(function(r){
      html += '<li>Session '+fmtDate(r.sessionDate)+' ('+RECOVERY_LABELS[r.recovery]+'): 24h ('+fmtDate(r.date24)+') — '+(r.has24h?"data available":"<strong>no data at 24h</strong>")+
        ' &middot; 48h ('+fmtDate(r.date48)+') — '+(r.has48h?"data available":"<strong>no data at 48h</strong>")+'</li>';
    });
    html += '</ul></div>';
  }

  var audit = Rules.programCompositionAudit(p);
  html += audit.length
    ? '<div class="alert alert-warning"><h4>Program composition audit</h4>Missing categories: '+audit.join(", ")+'</div>'
    : '<div class="alert alert-success"><h4>Program composition audit: complete</h4>All four categories (Core/Targeted/Endurance/Aerobic) are represented.</div>';

  var split = Rules.sessionSplitSuggestion(p);
  html += split.suggest
    ? '<div class="alert alert-warning"><h4>Session-split suggestion</h4>Average RPE over last '+split.count+' completed sessions is '+split.avgRpe.toFixed(1)+' (>5). Consider splitting into upper/lower extremity days.</div>'
    : '<div class="alert alert-success"><h4>Session-split: not suggested</h4>'+(split.avgRpe!=null?('Average RPE over last '+split.count+' sessions: '+split.avgRpe.toFixed(1)+'.'):'Not enough completed sessions yet.')+'</div>';

  if(isIbmPatient(p)){
    var ibmDecline = Rules.ibmfrsDeclineFlag(p);
    if(ibmDecline.triggered){
      html += '<div class="alert alert-danger"><h4>IBMFRS meaningful decline</h4>'+ibmDecline.message+' (Total: '+ibmDecline.previousTotal+' on '+fmtDate(ibmDecline.previousDate)+' → '+ibmDecline.currentTotal+' on '+fmtDate(ibmDecline.currentDate)+'). See the Functional Measures tab for the per-item breakdown.</div>';
    } else if(ibmDecline.hasData){
      html += '<div class="alert alert-success"><h4>IBMFRS: no meaningful decline</h4>Latest total change since previous visit: '+(ibmDecline.delta>0?"+":"")+ibmDecline.delta+' points (higher is better).</div>';
    } else {
      html += '<div class="alert alert-info"><h4>IBMFRS: not enough data yet</h4>Needs at least two itemized entries to check for a meaningful decline.</div>';
    }
  }

  html += '</div>';
  return html;
}

function renderClinicianProgram(p){
  var html = renderPhaseProgressionCard(p, true);
  var locked = Rules.weightedProgressionLocked(p);
  html += '<div class="card"><h2>Foundation Program</h2>';
  p.program.forEach(function(ex){
    html += '<div class="exercise-item"><div class="head"><strong>'+escapeHtml(ex.name)+'</strong><span class="pill pill-'+ex.category.toLowerCase()+'">'+ex.category+'</span></div>';
    html += '<p>'+escapeHtml(ex.prescription)+' <button class="btn ghost" style="padding:3px 9px;font-size:11.5px;" onclick="Actions.editPrescription(\''+p.id+'\',\''+ex.id+'\')">Edit</button></p>';
    if(ex.progression){
      var st = Rules.progressionStatus(ex.progression);
      html += '<h3>Weighted progression</h3>';
      html += '<p>Step <strong>'+ex.progression.step+'</strong> of 4 &middot; '+ex.progression.currentReps+' reps @ '+ex.progression.currentWeight+' lb &middot; '+ex.progression.currentSets+' set(s) &middot; ceiling '+ex.progression.ceiling+' lb</p>';
      html += '<p class="muted">'+(ex.progression.step<4
        ? ('Advances at '+PROGRESSION_STEPS[ex.progression.step].advanceAt+' reps sustained.')
        : 'Step 4: weight held, adds sets (max 3) as reps are sustained at 10–20.')+'</p>';
      if(locked){
        html += '<div class="alert alert-info" style="margin:6px 0;">🔒 Locked until Phase 2 (progression model: sequential).</div>';
        html += '<button class="btn secondary" disabled>Confirm advance…</button>';
      } else {
        html += st.readyToAdvance
          ? '<div class="alert alert-success" style="margin:6px 0;">Criteria met — ready for clinician review.</div>'
          : '<p class="muted">Not yet at advancement threshold.</p>';
        html += '<button class="btn secondary" onclick="Actions.confirmAdvance(\''+p.id+'\',\''+ex.id+'\')">Confirm advance…</button>';
      }
    }
    html += '<div class="history-list"><strong>Change history:</strong><ul>'+ex.history.slice().reverse().map(function(h){
      return '<li>'+fmtDate(h.date.slice(0,10))+' — '+escapeHtml(h.prescription)+'</li>';
    }).join("")+'</ul></div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderClinicianFom(p){
  var isIbm = isIbmPatient(p);
  var measures = fomMeasuresFor(p);

  var html = '<div class="card"><h2>Enter Functional Outcome Measures</h2>';
  if(isIbm) html += '<p class="muted">This patient’s diagnosis subtype is IBM, so the itemized IBMFRS is used here instead of FI-2/FI-3.</p>';
  html += '<form onsubmit="Actions.saveFom(event)"><div class="grid">';
  html += '<div class="field"><label>Date</label><input type="date" name="date" value="'+todayISO()+'" required></div>';
  FOM_COMMON_MEASURES.forEach(function(m){
    html += '<div class="field"><label>'+m.label+'</label><input type="number" step="0.1" name="'+m.key+'"></div>';
  });
  html += '</div>';
  if(isIbm){
    html += '<h3>IBMFRS items (0 = unable to perform, 4 = normal)</h3>';
    html += '<p class="muted">Placeholder item labels — see code comment on IBMFRS_ITEMS for why exact validated wording still needs to be sourced.</p>';
    html += '<div class="grid">';
    IBMFRS_ITEMS.forEach(function(it){
      html += '<div class="field"><label>'+it.label+': '+it.placeholder+'</label>'+
        '<select name="'+it.key+'" onchange="Actions.recalcIbmfrsTotal(this.form)">'+
        [0,1,2,3,4].map(function(v){ return '<option value="'+v+'">'+v+'</option>'; }).join("")+
        '</select></div>';
    });
    html += '</div>';
    html += '<p>Running total: <strong id="ibmfrsRunningTotal">0</strong> / 40</p>';
  } else {
    html += '<div class="grid">';
    FOM_NON_IBM_MEASURES.forEach(function(m){
      html += '<div class="field"><label>'+m.label+'</label><input type="number" step="0.1" name="'+m.key+'"></div>';
    });
    html += '</div>';
  }
  html += '<button type="submit" class="btn">Save measurement</button></form></div>';

  if(isIbm){
    var decline = Rules.ibmfrsDeclineFlag(p);
    if(decline.triggered){
      html += '<div class="alert alert-danger"><h4>IBMFRS meaningful decline</h4>'+decline.message+' (Total: '+decline.previousTotal+' on '+fmtDate(decline.previousDate)+' → '+decline.currentTotal+' on '+fmtDate(decline.currentDate)+')</div>';
    } else if(decline.hasData && decline.delta!=null){
      html += '<div class="alert '+(decline.delta>0?"alert-success":"alert-info")+'"><h4>IBMFRS since last visit</h4>'+
        'Total '+decline.previousTotal+' → '+decline.currentTotal+' ('+(decline.delta>0?"+":"")+decline.delta+' points; higher is better).</div>';
    }
  }

  var activeMeasure = measures.some(function(m){return m.key===State.fomMeasure;}) ? State.fomMeasure : measures[0].key;
  var measureDef = measures.find(function(m){ return m.key===activeMeasure; });
  html += '<div class="card"><h2>Trend</h2><div class="field"><label>Measure</label><select onchange="Actions.setFomMeasure(this.value)">'+
    measures.map(function(m){ return '<option value="'+m.key+'"'+(activeMeasure===m.key?" selected":"")+'>'+m.label+'</option>'; }).join("")+
    '</select></div>';
  var pts = p.fom.filter(function(f){ return f[activeMeasure]!=null; }).map(function(f){ return {date:f.date, value:f[activeMeasure]}; });
  var chartOpts = activeMeasure==="ibmfrsTotal" ? {yMin:0, yMax:40} : {};
  html += svgLineChart([{name:measureDef.label, color:"#2563a6", points:pts}], chartOpts);
  html += '<table><tr><th>Date</th>'+measures.map(function(m){return '<th>'+m.label+'</th>';}).join("")+'</tr>';
  p.fom.slice().reverse().forEach(function(f){
    html += '<tr><td>'+fmtDate(f.date)+'</td>'+measures.map(function(m){return '<td>'+(f[m.key]!=null?f[m.key]:"—")+'</td>';}).join("")+'</tr>';
  });
  html += '</table></div>';

  if(isIbm) html += renderIbmfrsItemBreakdown(p);
  return html;
}

// Itemized view: one tiny sparkline per IBMFRS item, so a decline concentrated in a few items
// (e.g. lower-limb tasks) is visible even when it wouldn't stand out in the total-score trend.
function renderIbmfrsItemBreakdown(p){
  var entries = p.fom.filter(function(f){ return Array.isArray(f.ibmfrsItems); })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var html = '<div class="card"><h2>IBMFRS per-item trend</h2>';
  if(entries.length<1){ html += '<p class="muted">No itemized IBMFRS entries recorded yet.</p></div>'; return html; }
  html += '<p class="muted">0–4 per item, higher is better. Each tile shows first → latest recorded score.</p>';
  html += '<div class="grid">';
  IBMFRS_ITEMS.forEach(function(item, idx){
    var pts = entries.map(function(e){ return {date:e.date, value:e.ibmfrsItems[idx]}; });
    var first = pts[0].value, last = pts[pts.length-1].value;
    var deltaColor = last>first ? "var(--success)" : (last<first ? "var(--danger)" : "var(--muted)");
    html += '<div class="ibmfrs-item"><div class="item-label">'+item.label+': '+item.placeholder+'</div>'+
      svgSparkline(pts, {yMin:0, yMax:4})+
      '<div class="item-delta" style="color:'+deltaColor+'">'+first+' → '+last+'</div></div>';
  });
  html += '</div></div>';
  return html;
}

function renderClinicianMmt(p){
  var html = '<div class="card"><h2>Enter Manual Muscle Test (0–5)</h2>';
  html += '<form onsubmit="Actions.saveMmt(event)"><div class="grid">';
  html += '<div class="field"><label>Date</label><input type="date" name="date" value="'+todayISO()+'" required></div>';
  MUSCLES.forEach(function(m){
    html += '<div class="field"><label>'+m.label+'</label><input type="number" step="0.5" min="0" max="5" name="'+m.key+'"></div>';
  });
  html += '</div><button type="submit" class="btn">Save MMT</button></form></div>';

  html += '<div class="card"><h2>Trend</h2><div class="field"><label>Muscle group</label><select onchange="Actions.setMmtMuscle(this.value)">'+
    MUSCLES.map(function(m){ return '<option value="'+m.key+'"'+(State.mmtMuscle===m.key?" selected":"")+'>'+m.label+'</option>'; }).join("")+
    '</select></div>';
  var pts = p.mmt.filter(function(f){ return f[State.mmtMuscle]!=null; }).map(function(f){ return {date:f.date, value:f[State.mmtMuscle]}; });
  html += svgLineChart([{name:MUSCLES.find(function(m){return m.key===State.mmtMuscle;}).label, color:"#7a2ea6", points:pts}], {yMin:0,yMax:5});
  html += '<table><tr><th>Date</th>'+MUSCLES.map(function(m){return '<th>'+m.label+'</th>';}).join("")+'</tr>';
  p.mmt.slice().reverse().forEach(function(f){
    html += '<tr><td>'+fmtDate(f.date)+'</td>'+MUSCLES.map(function(m){return '<td>'+(f[m.key]!=null?f[m.key]:"—")+'</td>';}).join("")+'</tr>';
  });
  html += '</table></div>';
  return html;
}

function renderClinicianClearance(p){
  var html = '<div class="card"><h2>Physician Clearance / Flare Status</h2>';
  html += '<div class="toggle-row"><div><strong>Cleared for exercise</strong><div class="muted">Gate check blocks the program when off.</div></div>'+
    '<label class="switch"><input type="checkbox" '+(p.clearedForExercise?"checked":"")+' onchange="Actions.toggleClearance(\''+p.id+'\')"><span class="slider"></span></label></div>';
  html += '<div class="toggle-row"><div><strong>Currently in flare</strong><div class="muted">Gate check blocks the program when on.</div></div>'+
    '<label class="switch"><input type="checkbox" '+(p.inFlare?"checked":"")+' onchange="Actions.toggleFlare(\''+p.id+'\')"><span class="slider"></span></label></div>';
  html += '</div>';
  return html;
}

function renderPdfImport(p){
  var html = '<div class="card"><h2>Import MedBridge HEP (PDF)</h2>';
  html += '<p class="muted">Uploads are parsed client-side only. Parsing is heuristic — always review before confirming; nothing is applied to the program automatically.</p>';
  html += '<input type="file" accept="application/pdf" onchange="Actions.pdfFileChosen(this)">';
  if(State.pdfError) html += '<div class="alert alert-warning" style="margin-top:10px;">'+escapeHtml(State.pdfError)+'</div>';
  html += '</div>';

  if(State.pdfReview){
    html += '<div class="card"><h2>Review parsed exercises</h2>';
    if(!State.pdfReview.length) html += '<p class="muted">No exercise-like lines were detected in this PDF.</p>';
    State.pdfReview.forEach(function(item, idx){
      html += '<div class="review-item"><label><input type="checkbox" '+(item.include?"checked":"")+' onchange="Actions.togglePdfInclude('+idx+')"> Include</label>';
      html += '<label class="muted">Name<input type="text" value="'+escapeHtml(item.name)+'" oninput="Actions.updatePdfReviewField('+idx+',\'name\',this.value)"></label>';
      html += '<label class="muted">Prescription<input type="text" value="'+escapeHtml(item.prescription)+'" oninput="Actions.updatePdfReviewField('+idx+',\'prescription\',this.value)"></label>';
      html += '<label class="muted">Category<select onchange="Actions.updatePdfReviewField('+idx+',\'category\',this.value)">'+
        CATEGORIES.map(function(c){ return '<option value="'+c+'"'+(item.category===c?" selected":"")+'>'+c+'</option>'; }).join("")+'</select></label>';
      html += '</div>';
    });
    html += '<div class="row" style="justify-content:flex-end;">';
    html += '<button class="btn ghost" onclick="Actions.cancelPdfReview()">Cancel</button>';
    html += '<button class="btn" onclick="Actions.confirmPdfImport()">Confirm & add to program</button>';
    html += '</div></div>';
  }
  return html;
}

/* ======================== Init ======================== */
window.Actions = Actions;
render();

})();
</script>
